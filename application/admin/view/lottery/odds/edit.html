<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="id" value="{$row.id}">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">彩种：</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" value="{$row.lottery_name}" readonly>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">玩法分类：</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" value="{$row.play_type_name}" readonly>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">投注选项：</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" value="{$row.bet_name} ({$row.bet_key})" readonly>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3"><span class="text-danger">*</span>赔率：</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="odds" value="{$row.odds}" step="0.01" min="0.01" required style="font-size:18px;font-weight:bold;">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">状态：</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="status">
                <option value="1" {if $row.status == 1}selected{/if}>启用</option>
                <option value="0" {if $row.status == 0}selected{/if}>禁用</option>
            </select>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed">确 定</button>
        </div>
    </div>
</form>
