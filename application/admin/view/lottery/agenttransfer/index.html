<h2>代理余额划转审计</h2>
<p>仅供查询，充值仍由后台客服办理。访问路径：/index.php/admin/lottery.agenttransfer/index</p>
<input id="keyword" placeholder="订单号 / 代理 / 下级"><button onclick="loadTransfers(1)">查询</button>
<div id="summary"></div><div id="records"></div><button onclick="loadTransfers(page-1)">上一页</button><button onclick="loadTransfers(page+1)">下一页</button>
<script>var page=1,total=0;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function loadTransfers(p){if(p<1||p>1&&p>(Math.ceil(total/20)))return;page=p;fetch('/index.php/admin/lottery.agenttransfer/index?ajax=1&page='+page+'&keyword='+encodeURIComponent(document.getElementById('keyword').value),{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(function(r){return r.json()}).then(function(r){if(r.code!==1)return;total=r.data.total;document.getElementById('summary').textContent='共 '+total+' 笔，第 '+page+' 页';document.getElementById('records').innerHTML='<table class="table table-striped"><tr><th>时间 / 单号</th><th>代理 / 下级</th><th>方向 / 金额</th><th>原因</th><th>余额前后</th><th>操作 IP</th></tr>'+r.data.list.map(function(x){return '<tr><td>'+esc(x.date)+'<br>'+esc(x.order_no)+'</td><td>'+esc(x.agent_name)+' / '+esc(x.sub_name)+'</td><td>'+(x.direction==='give'?'加款':'扣款')+' ¥'+esc(x.amount)+'</td><td>'+esc(x.remark)+'</td><td>转出 '+esc(x.from_before)+' → '+esc(x.from_after)+'<br>转入 '+esc(x.to_before)+' → '+esc(x.to_after)+'</td><td>'+esc(x.operator_ip)+'</td></tr>'}).join('')+'</table>'})}loadTransfers(1);</script>
