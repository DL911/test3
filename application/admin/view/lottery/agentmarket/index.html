<div class="panel panel-default" data-market-admin="1" data-market-endpoint="{:url('lottery/agentmarket/index')}"><div class="panel-heading"><h3 class="panel-title">代理市场核算报表</h3></div><div class="panel-body"><p>只读查询，不自动分账或变动余额。输入准确的代理登录账号后查询。</p>
<div class="form-inline" style="display:flex;gap:8px;flex-wrap:wrap"><input class="form-control" id="mrAgentSearch" placeholder="代理登录账号"><input class="form-control" id="mrStart" type="date"><input class="form-control" id="mrEnd" type="date"><input class="form-control" id="mrDirect" type="number" placeholder="直属分支ID"><input class="form-control" id="mrUserId" type="number" placeholder="下级用户ID"><input class="form-control" id="mrUserSearch" placeholder="用户账号搜索"><select class="form-control" id="mrType"><option value="">全部彩种</option><option value="1">福彩3D</option><option value="2">排列三</option></select><button class="btn btn-primary" id="mrSearch">查询</button><button class="btn btn-default" id="mrClearUser">查看市场汇总</button></div><p id="mrMessage" class="text-danger"></p>
<h4 id="mrScope">市场汇总</h4><div id="mrSummary" style="display:flex;gap:12px;flex-wrap:wrap"></div><p id="mrCount"></p><p class="text-muted">日期按投注时间，最多31天；已结算差额仅供人工核对，非代理应结收益。撤单不计入汇总。</p>
<h4>用户汇总</h4><div class="table-responsive"><table class="table table-striped"><thead><tr><th>用户</th><th>有效订单</th><th>有效投注</th><th>实际派奖</th><th>未中奖投注</th></tr></thead><tbody id="mrUsers"></tbody></table></div><p><button class="btn btn-default" id="mrUserPrev">上一页</button> <span id="mrUserPager"></span> <button class="btn btn-default" id="mrUserNext">下一页</button></p>
<h4>投注订单</h4><div class="table-responsive"><table class="table table-striped"><thead><tr><th>时间 / 单号</th><th>用户</th><th>彩种 / 期号</th><th>状态</th><th>投注</th><th>派奖</th><th>内容</th></tr></thead><tbody id="mrBets"></tbody></table></div><p><button class="btn btn-default" id="mrPrev">上一页</button> <span id="mrPager"></span> <button class="btn btn-default" id="mrNext">下一页</button></p>
<div id="mrUserOnly" style="display:none"><h4>该用户已记录的资金流水</h4><p class="text-muted">现有日志可能不包含全部历史投注扣款和派奖；请结合订单核对。</p><div class="table-responsive"><table class="table table-striped"><thead><tr><th>时间</th><th>变动</th><th>余额前后</th><th>说明</th></tr></thead><tbody id="mrMoneyLogs"></tbody></table></div><h4>该用户投注产生的返水</h4><div class="table-responsive"><table class="table table-striped"><thead><tr><th>生成时间</th><th>投注单号</th><th>类型</th><th>金额</th><th>状态</th></tr></thead><tbody id="mrRebates"></tbody></table></div><p id="mrFlowPager"></p></div>
