<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="panel-lead"><em>流水返利配置</em>管理返利阶梯比例</div>
        <ul class="nav nav-tabs">
            <li class="active"><a href="#t-all" data-toggle="tab">列表</a></li>
        </ul>
    </div>
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-success btn-add" data-toggle="modal" data-target="#editModal" onclick="openAdd()"><i class="fa fa-plus"></i> 添加阶梯</a>
        </div>
        <table id="table" class="table table-striped table-bordered" data-toolbar="#toolbar" data-url="lottery/rebate_config/index" data-side-pagination="server" data-pagination="false">
            <thead>
                <tr>
                    <th data-field="id" data-sortable="true">ID</th>
                    <th data-field="min_amount">最低流水</th>
                    <th data-field="max_amount">最高流水</th>
                    <th data-field="rebate_rate" data-formatter="rateFormatter">返利比例</th>
                    <th data-field="remark">备注</th>
                    <th data-field="status" data-formatter="statusFormatter">状态</th>
                    <th data-field="id" data-formatter="actionFormatter">操作</th>
                </tr>
            </thead>
        </table>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h4 class="modal-title" id="modalTitle">添加返利阶梯</h4></div>
            <form id="editForm">
                <div class="modal-body">
                    <input type="hidden" name="id" id="editId">
                    <div class="form-group"><label>最低流水金额</label><input type="number" step="0.01" class="form-control" name="min_amount" id="editMin" required></div>
                    <div class="form-group"><label>最高流水金额 (0=无上限)</label><input type="number" step="0.01" class="form-control" name="max_amount" id="editMax" value="0"></div>
                    <div class="form-group"><label>返利比例 (如0.01=1%)</label><input type="number" step="0.0001" class="form-control" name="rebate_rate" id="editRate" required></div>
                    <div class="form-group"><label>备注</label><input type="text" class="form-control" name="remark" id="editRemark"></div>
                    <div class="form-group"><label>状态</label><select class="form-control" name="status" id="editStatus"><option value="1">启用</option><option value="0">禁用</option></select></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitEdit()">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function rateFormatter(v) { return (v * 100).toFixed(2) + '%'; }
function statusFormatter(v) { return v == 1 ? '<span class="label label-success">启用</span>' : '<span class="label label-default">禁用</span>'; }
function actionFormatter(v, row) {
    return '<a href="javascript:;" class="btn btn-xs btn-info" onclick=\'openEdit('+JSON.stringify(row)+')\'>编辑</a> ' +
           '<a href="javascript:;" class="btn btn-xs btn-danger" onclick="doDel('+v+')">删除</a>';
}
function openAdd() {
    document.getElementById('modalTitle').textContent = '添加返利阶梯';
    document.getElementById('editId').value = '';
    document.getElementById('editMin').value = '';
    document.getElementById('editMax').value = '0';
    document.getElementById('editRate').value = '';
    document.getElementById('editRemark').value = '';
    document.getElementById('editStatus').value = '1';
    $('#editModal').modal('show');
}
function openEdit(row) {
    document.getElementById('modalTitle').textContent = '编辑返利阶梯';
    document.getElementById('editId').value = row.id;
    document.getElementById('editMin').value = row.min_amount;
    document.getElementById('editMax').value = row.max_amount;
    document.getElementById('editRate').value = row.rebate_rate;
    document.getElementById('editRemark').value = row.remark || '';
    document.getElementById('editStatus').value = row.status;
    $('#editModal').modal('show');
}
function submitEdit() {
    $.post('lottery/rebate_config/edit', $('#editForm').serialize(), function(res) {
        if (res.code === 1) { Toastr.success(res.msg); $('#editModal').modal('hide'); $('#table').bootstrapTable('refresh'); }
        else { Toastr.error(res.msg); }
    }, 'json');
}
function doDel(id) {
    Layer.confirm('确认删除?', function(){ $.post('lottery/rebate_config/del', {ids:id}, function(res){ if(res.code===1){Toastr.success(res.msg);$('#table').bootstrapTable('refresh');}else{Toastr.error(res.msg);} },'json'); });
}
</script>
