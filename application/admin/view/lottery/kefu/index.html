<style>
.kefu-container {
    display: flex;
    height: calc(100vh - 120px);
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
}
.kefu-sidebar {
    width: 260px;
    border-right: 1px solid #eee;
    overflow-y: auto;
    background: #fafafa;
}
.kefu-sidebar-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #999;
    font-size: 14px;
    flex-direction: column;
    gap: 10px;
}
.kefu-sidebar-empty i { font-size: 40px; color: #ddd; }
.kefu-main {
    flex: 1;
    display: flex;
    flex-direction: column;
}
.kefu-chat-header {
    height: 50px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 16px;
    font-weight: bold;
    background: #fff;
}
.kefu-chat-area {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f5f7f9;
}
.kefu-input-area {
    border-top: 1px solid #eee;
    padding: 10px;
    display: flex;
    background: #fff;
}
.kefu-input-area textarea {
    flex: 1;
    height: 80px;
    resize: none;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
}
.kefu-btn-send {
    width: 100px;
    margin-left: 10px;
    border-radius: 4px;
}
.user-item {
    padding: 12px 15px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    display: flex;
    align-items: center;
}
.user-item .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    margin-right: 10px;
    background: #18bc9c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    flex-shrink: 0;
}
.user-info { flex: 1; overflow: hidden; }
.user-name { font-weight: bold; font-size: 14px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.user-time { font-size: 12px; color: #999; margin-top: 2px; }
.user-remark { font-size:11px;color:#e67e22;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.user-item:hover, .user-item.active { background: #e6f7ff; }
.user-unread {
    background: #ff4d4f; color: white; font-size: 12px; border-radius: 10px;
    padding: 0 6px; height: 20px; line-height: 20px; margin-left: 5px; flex-shrink: 0;
}

.msg-row { margin-bottom: 15px; display: flex; align-items: flex-start; }
.msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: #18bc9c; text-align: center; line-height: 36px; color: white; margin-right: 10px; flex-shrink: 0; }
.msg-row.user .msg-avatar { background: #1890ff; }
.msg-row.admin { flex-direction: row-reverse; }
.msg-row.admin .msg-avatar { margin-right: 0; margin-left: 10px; background: #18bc9c; }
.msg-content-wrap { max-width: 70%; }
.msg-time { font-size: 11px; color: #bbb; margin-bottom: 3px; }
.msg-row.admin .msg-time { text-align: right; }
.msg-bubble {
    padding: 10px 15px; border-radius: 8px; background: #fff;
    border: 1px solid #eee; box-shadow: 0 1px 2px rgba(0,0,0,0.04); word-break: break-all;
    font-size: 14px; line-height: 1.5;
}
.msg-row.admin .msg-bubble { background: #18bc9c; color: #fff; border: none; }

.kefu-placeholder {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: #ccc; font-size: 15px; flex-direction: column; gap: 10px;
}
.kefu-placeholder i { font-size: 50px; }

.msg-bubble img { max-width: 200px; max-height: 200px; border-radius: 6px; cursor: pointer; display: block; }
.kefu-toolbar { display: flex; align-items: center; gap: 8px; border-top: 1px solid #eee; padding: 6px 10px; background: #fafafa; }
.kefu-toolbar .btn-img { background: none; border: 1px solid #ddd; border-radius: 4px; padding: 4px 10px; cursor: pointer; color: #666; font-size: 13px; }
.kefu-toolbar .btn-img:hover { background: #e6f7ff; border-color: #1890ff; color: #1890ff; }
.kefu-toolbar .send-hint { margin-left: auto; font-size: 11px; color: #bbb; }
.channel-bar { display:flex; gap:8px; align-items:center; padding:10px; background:#fff; border:1px solid #ddd; border-bottom:0; }
.channel-tab { border:1px solid #ddd; background:#fafafa; padding:6px 12px; border-radius:4px; cursor:pointer; }
.channel-tab.active { color:#fff; border-color:transparent; background:#18bc9c; }
.channel-manage { margin-left:auto; }
</style>

<div class="channel-bar" id="channelBar"><span style="color:#999">加载通道...</span><button class="btn btn-default btn-xs channel-manage" id="manageChannels"><i class="fa fa-cog"></i> 通道管理</button></div>
<div class="kefu-container">
    <div class="kefu-sidebar" id="userList">
        <div class="kefu-sidebar-empty">
            <i class="fa fa-inbox"></i>
            <span>暂无用户咨询</span>
        </div>
    </div>
    <div class="kefu-main" id="chatMain">
        <div class="kefu-chat-header" id="chatHeader">
            <i class="fa fa-comments" style="margin-right:8px;color:#18bc9c;"></i> 客服工作台
        </div>
        <div class="kefu-chat-area" id="chatArea">
            <div class="kefu-placeholder" id="chatPlaceholder">
                <i class="fa fa-comment-dots"></i>
                <span>请从左侧选择一个用户开始会话</span>
            </div>
        </div>
        <div id="inputArea" style="display:none;">
            <div class="kefu-toolbar">
                <label class="btn-img" for="imgUpload"><i class="fa fa-image"></i> 图片</label>
                <input type="file" id="imgUpload" accept="image/*" style="display:none;">
                <span class="send-hint">Enter 发送 / Shift+Enter 换行</span>
            </div>
            <div class="kefu-input-area">
                <textarea id="chatInput" placeholder="输入回复内容..."></textarea>
                <button class="btn btn-primary kefu-btn-send" id="btnSend">发 送</button>
            </div>
        </div>
    </div>
</div>

<script>
(function waitForJQuery() {
    if (typeof jQuery === 'undefined') { setTimeout(waitForJQuery, 100); return; }
    var $ = jQuery;
    // 根据当前 iframe URL 自动获取后台入口路径
    var kefuBasePath = (function() {
        var path = window.location.pathname;
        var match = path.match(/(\/[^\/]*\.php)/i);
        return match ? match[1] : '/index.php';
    })();

    var currentUserId = 0;
    var currentChannel = 'general';
    var channelMap = {};
    var lastMsgId = 0;

    function kefuUrl(action) {
        return kefuBasePath + '/lottery/kefu/' + action;
    }

    function formatTime(timestamp) {
        var date = new Date(timestamp * 1000);
        var m = (date.getMonth()+1).toString().padStart(2, '0');
        var d = date.getDate().toString().padStart(2, '0');
        var h = date.getHours().toString().padStart(2, '0');
        var min = date.getMinutes().toString().padStart(2, '0');
        return m+'-'+d+' '+h+':'+min;
    }

    function scrollToBottom() {
        var area = $("#chatArea");
        if (area[0]) area.scrollTop(area[0].scrollHeight);
    }

    function loadUserList() {
        $.ajax({
            url: kefuUrl('get_user_list'),
            type: "GET",
            data: {channel: currentChannel},
            success: function(res) {
                if(res.code == 1) {
                    if(!res.data || res.data.length === 0) {
                        $("#userList").html('<div class="kefu-sidebar-empty"><i class="fa fa-inbox"></i><span>暂无用户咨询</span></div>');
                        return;
                    }
                    var html = '';
                    res.data.forEach(function(u) {
                        var activeCls = (u.id == currentUserId) ? 'active' : '';
                        var unreadHtml = u.unread > 0 ? '<span class="user-unread">'+u.unread+'</span>' : '';
                        var showName = u.service_remark ? u.service_remark : (u.nickname||u.username);
                        html += '<div class="user-item '+activeCls+'" data-id="'+u.id+'" data-name="'+showName+'" data-remark="'+(u.service_remark||'')+'">'
                            + '<div class="avatar"><i class="fa fa-user"></i></div>'
                            + '<div class="user-info">'
                            + '<div class="user-name">'+(u.nickname||u.username)+' (ID:'+u.id+')</div>'
                            + '<div class="user-remark">'+(u.service_remark ? '备注：'+u.service_remark : '点击会话后可设置备注')+'</div>'
                            + '<div class="user-time">'+formatTime(u.last_time)+'</div>'
                            + '</div>'
                            + unreadHtml
                            + '</div>';
                    });
                    $("#userList").html(html);

                    $(".user-item").on('click', function() {
                        var uid = $(this).data('id');
                        var uname = $(this).data('name');
                        currentUserId = uid;
                        lastMsgId = 0;
                        $("#chatArea").empty();
                        $("#chatPlaceholder").remove();
                        var cname = channelMap[currentChannel] ? channelMap[currentChannel].name : currentChannel;
                        $("#chatHeader").html('<i class="fa fa-user" style="margin-right:8px;color:#1890ff;"></i> [' + cname + '] 正在与 ' + uname + ' 交谈 <button class="btn btn-xs btn-default" id="editRemark" style="margin-left:auto"><i class="fa fa-pencil"></i> 设置备注</button>');
                        $('#editRemark').on('click', function(){
                            layer.prompt({title:'设置当前咨询用户备注',value:$('.user-item.active').data('remark')||''},function(value,idx){
                                $.post(kefuUrl('save_user_remark'),{user_id:currentUserId,channel:currentChannel,remark:value},function(r){if(r.code==1){layer.close(idx);layer.msg('备注已保存');loadUserList();}else layer.alert(r.msg||'保存失败');});
                            });
                        });
                        $("#inputArea").show();
                        $(".user-item").removeClass('active');
                        $(this).addClass('active');
                        $(this).find('.user-unread').remove();
                        loadChatHistory();
                    });
                }
            }
        });
    }

    function loadChatHistory() {
        if(!currentUserId) return;
        $.ajax({
            url: kefuUrl('get_chat_history'),
            type: "GET",
            data: {user_id: currentUserId, channel: currentChannel, last_id: lastMsgId},
            success: function(res) {
                if(res.code == 1 && res.data && res.data.length > 0) {
                    var html = '';
                    res.data.forEach(function(msg) {
                        var isAdmin = (msg.sender_type == 'admin');
                        var cls = isAdmin ? 'admin' : 'user';
                        var icon = isAdmin ? 'fa-headset' : 'fa-user';
                        var bubbleContent = msg.content;
                        // 检测图片消息
                        if (bubbleContent.match(/^\[img\](.*?)\[\/img\]$/)) {
                            var imgUrl = bubbleContent.replace(/^\[img\]/, '').replace(/\[\/img\]$/, '');
                            bubbleContent = '<img src="'+imgUrl+'" onclick="window.open(this.src)">';
                        }
                        html += '<div class="msg-row '+cls+'">' 
                            + '<div class="msg-avatar"><i class="fa '+icon+'"></i></div>'
                            + '<div class="msg-content-wrap">'
                            + '<div class="msg-time">'+formatTime(msg.createtime)+'</div>'
                            + '<div class="msg-bubble">'+bubbleContent+'</div>'
                            + '</div></div>';
                        if(parseInt(msg.id) > lastMsgId) lastMsgId = parseInt(msg.id);
                    });
                    $("#chatArea").append(html);
                    scrollToBottom();
                }
            }
        });
    }

    function sendMessage() {
        if(!currentUserId) return;
        var content = $("#chatInput").val().trim();
        if(!content) return;

        $("#btnSend").prop('disabled', true);
        $("#chatInput").val("").focus();

        $.ajax({
            url: kefuUrl('send_message'),
            type: "POST",
            data: {user_id: currentUserId, channel: currentChannel, content: content},
            success: function(res) {
                $("#btnSend").prop('disabled', false);
                if(res.code == 1) {
                    loadChatHistory();
                } else {
                    alert(res.msg || '发送失败');
                }
            },
            error: function() {
                $("#btnSend").prop('disabled', false);
                alert("网络错误，发送失败");
            }
        });
    }

    function loadChannels() {
        $.get(kefuUrl('channels'), function(res) {
            if(res.code != 1 || !res.data) return;
            var html = '';
            res.data.forEach(function(c) {
                channelMap[c.code] = c;
                if(parseInt(c.status) !== 1) return;
                html += '<button class="channel-tab '+(c.code===currentChannel?'active':'')+'" data-code="'+c.code+'" style="--channel-color:'+c.color+'">'+c.name+'</button>';
            });
            html += '<button class="btn btn-default btn-xs channel-manage" id="manageChannels"><i class="fa fa-cog"></i> 通道管理</button>';
            $('#channelBar').html(html);
            $('.channel-tab').on('click', function(){
                currentChannel=$(this).data('code'); currentUserId=0; lastMsgId=0;
                $('.channel-tab').removeClass('active'); $(this).addClass('active');
                $('#chatArea').html('<div class="kefu-placeholder"><i class="fa fa-comment-dots"></i><span>请从左侧选择一个用户开始会话</span></div>');
                $('#inputArea').hide(); loadUserList();
            });
            $('#manageChannels').on('click', showChannelManager);
        });
    }

    function showChannelManager() {
        var rows='';
        Object.keys(channelMap).forEach(function(code){var c=channelMap[code]; rows += '<div class="panel panel-default" style="padding:12px;margin-bottom:10px"><div class="row"><div class="col-sm-2"><b>'+c.code+'</b><input class="form-control input-sm c-name" value="'+c.name+'"></div><div class="col-sm-3">滚动公告<input class="form-control input-sm c-ann" value="'+(c.announcement||'')+'"></div><div class="col-sm-3">宣传图片<div class="input-group"><input class="form-control input-sm c-image" value="'+(c.image||'')+'" placeholder="图片URL"><span class="input-group-btn"><button class="btn btn-default btn-sm upload-channel-image" type="button"><i class="fa fa-upload"></i> 上传</button></span></div><input class="channel-image-file" type="file" accept="image/*" style="display:none"></div><div class="col-sm-3">玩法介绍<textarea class="form-control input-sm c-intro" rows="3">'+(c.intro||'')+'</textarea></div><div class="col-sm-1"><label><input type="checkbox" class="c-status" '+(parseInt(c.status)===1?'checked':'')+'>启用</label><button class="btn btn-primary btn-xs save-channel" data-id="'+c.id+'" data-code="'+c.code+'">保存</button></div></div></div>';});
        layer.open({type:1,title:'客服通道、公告和展示内容管理',area:['1050px','650px'],content:'<div style="padding:15px">'+rows+'<hr><h5>新增通道</h5><div class="form-inline"><input id="newCode" class="form-control" placeholder="英文编码"><input id="newName" class="form-control" placeholder="显示名称"><button id="addChannel" class="btn btn-success">新增</button></div></div>',success:function(box){
            box.find('.save-channel').click(function(){var tr=$(this).closest('.panel'); saveChannel({id:$(this).data('id'),code:$(this).data('code'),name:tr.find('.c-name').val(),announcement:tr.find('.c-ann').val(),image:tr.find('.c-image').val(),intro:tr.find('.c-intro').val(),status:tr.find('.c-status').prop('checked')?1:0});});
            box.find('.upload-channel-image').click(function(){ $(this).closest('.panel').find('.channel-image-file').click(); });
            box.find('.channel-image-file').change(function(){
                var input=this,panel=$(this).closest('.panel'); if(!input.files[0]) return;
                var fd=new FormData(); fd.append('file',input.files[0]);
                $.ajax({url:kefuUrl('upload_image'),type:'POST',data:fd,processData:false,contentType:false,success:function(r){
                    if(r.code==1&&r.data&&r.data.url){panel.find('.c-image').val(r.data.url);layer.msg('上传成功，请点击保存');}
                    else layer.alert(r.msg||'上传失败');
                },error:function(){layer.alert('上传失败');}}); input.value='';
            });
            box.find('#addChannel').click(function(){saveChannel({code:box.find('#newCode').val(),name:box.find('#newName').val(),status:1});});
        }});
    }
    function saveChannel(data){$.post(kefuUrl('save_channel'),data,function(res){if(res.code==1){layer.msg('保存成功'); channelMap={}; loadChannels();}else layer.alert(res.msg||'保存失败');});}

    // 初始化
    loadChannels();
    loadUserList();
    $("#btnSend").on('click', sendMessage);
    $("#chatInput").on('keydown', function(e) {
        if(e.keyCode == 13 && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 图片上传
    $("#imgUpload").on('change', function() {
        if(!currentUserId) { alert('请先选择用户'); return; }
        var file = this.files[0];
        if(!file) return;
        var formData = new FormData();
        formData.append('file', file);
        $.ajax({
            url: kefuUrl('upload_image'),
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                if(res.code == 1 && res.data && res.data.url) {
                    // 发送图片消息，用 [img] 标签包裹
                    $.ajax({
                        url: kefuUrl('send_message'),
                        type: 'POST',
                        data: {user_id: currentUserId, channel: currentChannel, content: '[img]'+res.data.url+'[/img]'},
                        success: function(r) {
                            if(r.code == 1) loadChatHistory();
                        }
                    });
                } else {
                    alert(res.msg || '上传失败');
                }
            },
            error: function() { alert('上传失败'); }
        });
        this.value = ''; // 清空以便重复选择同一文件
    });

    setInterval(loadUserList, 5000);
    setInterval(loadChatHistory, 3000);
})();
</script>
