<div class="panel panel-default panel-intro">
    <div class="panel-heading"><h3 class="panel-title">代理开户与返水设置</h3></div>
    <div class="panel-body">
        <div class="alert alert-info"><i class="fa fa-info-circle"></i> 前台公开注册已关闭。每笔有效投注生成返水，奖励次日可由用户主动领取。</div>
        <div class="row" style="margin-bottom:18px;">
            <div class="col-sm-3"><div class="well"><small>用户总数</small><h3 id="statTotal">-</h3></div></div>
            <div class="col-sm-3"><div class="well"><small>今日开户</small><h3 id="statToday">-</h3></div></div>
            <div class="col-sm-3"><div class="well"><small>代理数量</small><h3 id="statAgents">-</h3></div></div>
            <div class="col-sm-3"><div class="well"><small>已绑定上级</small><h3 id="statInvited">-</h3></div></div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="panel panel-primary">
                    <div class="panel-heading">系统规则</div>
                    <div class="panel-body">
                        <div class="form-group"><label>注册模式</label><input class="form-control" value="仅代理开户" disabled></div>
                        <div class="form-group"><label>系统最高返水比例 (%)</label><input type="number" min="0" max="100" step="0.01" class="form-control" id="maxRate"></div>
                        <div class="form-group"><label>最小代理级差 (%)</label><input type="number" min="0" max="100" step="0.01" class="form-control" id="minGap"></div>
                        <div class="form-group"><label>奖励规则</label><input class="form-control" value="每笔投注生成，次日00:00后可领取" disabled></div>
                        <button class="btn btn-primary" onclick="saveConfig()"><i class="fa fa-save"></i> 保存设置</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="panel panel-success">
                    <div class="panel-heading">创建顶级代理</div>
                    <div class="panel-body">
                        <div class="form-group"><label>登录账号</label><input class="form-control" id="agentUsername" maxlength="20"></div>
                        <div class="form-group"><label>手机号（选填）</label><input class="form-control" id="agentMobile" maxlength="11"></div>
                        <div class="form-group"><label>初始密码</label><input type="text" class="form-control" id="agentPassword" value="88888888" maxlength="30"><p class="help-block">默认密码为 8 个 8，创建前可直接修改。</p></div>
                        <div class="form-group"><label>返水比例 (%)</label><input type="number" min="0" step="0.01" class="form-control" id="agentRate"></div>
                        <button class="btn btn-success" onclick="createTopAgent()"><i class="fa fa-user-plus"></i> 创建顶级代理</button>
                    </div>
                </div>
            </div>
        </div>

        <h4>顶级代理</h4>
        <table class="table table-bordered table-striped">
            <thead><tr><th>ID</th><th>账号</th><th>手机号</th><th>返水比例</th><th>开户权限</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="agentBody"><tr><td colspan="8" class="text-center text-muted">加载中...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
(function(){
    var entry=(function(){var m=location.pathname.match(/^(\/[^\/]+\.php)/);return m?m[1]:'';})();
    var base=entry+'/lottery/register_config/';
    function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
    function post(action,data,done){var fd=new FormData();Object.keys(data).forEach(function(k){fd.append(k,data[k]);});var x=new XMLHttpRequest();x.open('POST',base+action,true);x.setRequestHeader('X-Requested-With','XMLHttpRequest');x.onload=function(){try{done(JSON.parse(x.responseText));}catch(e){alert('响应解析失败');}};x.send(fd);}
    window.loadAgentConfig=function(){var x=new XMLHttpRequest();x.open('GET',base+'index',true);x.setRequestHeader('X-Requested-With','XMLHttpRequest');x.onload=function(){var r=JSON.parse(x.responseText),d=r.data||{},s=d.stats||{},c=d.config||{},defaultRate=(parseFloat(c.max_rebate_rate||0)*100).toFixed(2);statTotal.textContent=s.total_users||0;statToday.textContent=s.today_users||0;statAgents.textContent=s.agent_users||0;statInvited.textContent=s.invited_users||0;maxRate.value=defaultRate;minGap.value=(parseFloat(c.min_rate_gap||0)*100).toFixed(2);if(!agentRate.value)agentRate.value=defaultRate;var h='';(d.top_agents||[]).forEach(function(a){var normal=a.status==='normal',statusText=normal?'正常':'已禁用';h+='<tr><td>'+a.id+'</td><td>'+esc(a.nickname||a.username)+'</td><td>'+esc(a.mobile||'--')+'</td><td><b>'+(parseFloat(a.self_rebate_rate||0)*100).toFixed(2)+'%</b></td><td>'+(a.can_open_account==1?'允许':'禁止')+'</td><td><span class="label '+(normal?'label-success':'label-default')+'">'+statusText+'</span></td><td>'+new Date(a.createtime*1000).toLocaleString()+'</td><td><button type="button" class="btn btn-xs btn-warning" onclick="resetTopAgentPassword('+a.id+',\''+esc(a.username).replace(/'/g,'&#39;')+'\')"><i class="fa fa-key"></i> 重置密码</button> <button type="button" class="btn btn-xs '+(normal?'btn-danger':'btn-success')+'" onclick="toggleTopAgentStatus('+a.id+',\''+esc(a.username).replace(/'/g,'&#39;')+'\','+(normal?'true':'false')+')"><i class="fa '+(normal?'fa-ban':'fa-check')+'"></i> '+(normal?'禁用':'启用')+'</button></td></tr>';});agentBody.innerHTML=h||'<tr><td colspan="8" class="text-center text-muted">暂无顶级代理</td></tr>';};x.send();};
    window.saveConfig=function(){post('saveConfig',{max_rebate_rate:maxRate.value,min_rate_gap:minGap.value},function(r){alert(r.msg);if(r.code===1)loadAgentConfig();});};
    window.createTopAgent=function(){if(!confirm('确认创建该顶级代理？'))return;post('createTopAgent',{username:agentUsername.value,mobile:agentMobile.value,password:agentPassword.value,rebate_rate:agentRate.value},function(r){alert(r.msg);if(r.code===1){agentUsername.value='';agentMobile.value='';agentPassword.value='88888888';agentRate.value='';loadAgentConfig();}});};
    window.resetTopAgentPassword=function(agentId,username){var password=prompt('请输入顶级代理 '+username+' 的新密码（6-30位）：');if(password===null)return;if(password.length<6||password.length>30){alert('密码长度需为6-30位');return;}var confirmPassword=prompt('请再次输入新密码：');if(confirmPassword===null)return;if(password!==confirmPassword){alert('两次输入的密码不一致');return;}if(!confirm('确认重置顶级代理 '+username+' 的密码？该账号当前登录状态将失效。'))return;post('resetTopAgentPassword',{agent_id:agentId,password:password},function(r){alert(r.msg);if(r.code===1)loadAgentConfig();});};
    window.toggleTopAgentStatus=function(agentId,username,isNormal){var action=isNormal?'禁用':'启用';if(!confirm('确认'+action+'顶级代理 '+username+'？'+(isNormal?'禁用后该账号将立即退出登录，且无法继续登录。':'')))return;post('toggleTopAgentStatus',{agent_id:agentId},function(r){alert(r.msg);if(r.code===1)loadAgentConfig();});};
    loadAgentConfig();
})();
</script>
