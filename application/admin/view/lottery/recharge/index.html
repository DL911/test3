<div class="panel panel-default panel-intro">
    <div class="panel-heading"><h3 class="panel-title">充值订单管理</h3></div>
    <div class="panel-body">
        <div style="margin-bottom:15px;">
            <select id="filterStatus" class="form-control" style="width:120px;display:inline-block;margin-right:10px;">
                <option value="">全部状态</option>
                <option value="0">待审核</option>
                <option value="1">已到账</option>
                <option value="2">已拒绝</option>
            </select>
            <input type="text" id="filterKeyword" class="form-control" placeholder="订单号/用户名" style="width:200px;display:inline-block;margin-right:10px;">
            <button class="btn btn-primary" onclick="rcLoadList()"><i class="fa fa-search"></i> 搜索</button>
        </div>
        <table class="table table-bordered table-hover">
            <thead><tr>
                <th width="50">ID</th><th>订单号</th><th>用户</th><th>真实姓名</th><th>金额</th><th>支付方式</th><th>USDT地址</th><th>凭证</th><th>状态</th><th>备注</th><th>时间</th><th width="210">操作</th>
            </tr></thead>
            <tbody id="tableBody"><tr><td colspan="12" style="text-align:center;color:#999;">加载中...</td></tr></tbody>
        </table>
        <div id="pagination" style="text-align:center;"></div>
    </div>
</div>

<!-- 凭证弹窗 -->
<div id="proofOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;" onclick="this.style.display='none'">
    <img id="proofImg" src="" style="max-width:90%;max-height:90%;border-radius:8px;">
</div>

<script>
var rcPage = 1;

function rcLoadList(page) {
    rcPage = page || 1;
    var status = document.getElementById('filterStatus').value;
    var keyword = document.getElementById('filterKeyword').value;
    var url = location.href + (location.href.indexOf('?')>-1?'&':'?') + 'page='+rcPage+'&limit=20&status='+encodeURIComponent(status)+'&keyword='+encodeURIComponent(keyword);

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onload = function(){
        try {
            var res = JSON.parse(xhr.responseText);
            if(res.code !== 1) { document.getElementById('tableBody').innerHTML='<tr><td colspan="12" style="color:red;">'+rcEscape(res.msg)+'</td></tr>'; return; }
            var d = res.data, list = d.list || [], html = '';
            if(!list.length){
                html = '<tr><td colspan="12" style="text-align:center;color:#999;">暂无数据</td></tr>';
            } else {
                for(var i=0;i<list.length;i++){
                    var r = list[i];
                    var sc = r.status==0?'label-warning':(r.status==1?'label-success':'label-danger');
                    var proofBtn = r.pay_proof ? '<a href="javascript:;" onclick="rcShowProof(\''+r.pay_proof+'\')" class="btn btn-xs btn-info"><i class="fa fa-image"></i> 查看</a>' : '<span class="text-muted">无</span>';
                    var actions = '';
                    if(r.status == 0){
                        actions = '<button class="btn btn-xs btn-success" onclick="rcAudit('+r.id+',\'approve\')"><i class="fa fa-check"></i> 通过</button> '+
                                  '<button class="btn btn-xs btn-danger" onclick="rcAudit('+r.id+',\'reject\')"><i class="fa fa-times"></i> 拒绝</button>';
                    } else {
                        actions = '<span class="text-muted">已处理</span>';
                    }
                    actions += ' <button class="btn btn-xs btn-primary" onclick="rcOpenChat('+parseInt(r.user_id,10)+')"><i class="fa fa-comments"></i> 会话</button>';
                    var addrHtml = (r.usdt_address && r.pay_type==='usdt') ? '<small style="color:#1890ff;word-break:break-all;">'+r.usdt_address+'</small>' : '<span class="text-muted">-</span>';
                    html += '<tr>'+
                        '<td>'+r.id+'</td>'+
                        '<td><small>'+r.order_no+'</small></td>'+
                        '<td>'+(r.nickname||r.username||'--')+'</td>'+
                        '<td>'+(r.real_name ? rcEscape(r.real_name) : '<span class="text-muted">未填写</span>')+'</td>'+
                        '<td><strong style="color:#f60;">¥'+parseFloat(r.amount).toFixed(2)+'</strong></td>'+
                        '<td>'+(r.pay_type_text||r.pay_type)+'</td>'+
                        '<td>'+addrHtml+'</td>'+
                        '<td>'+proofBtn+'</td>'+
                        '<td><span class="label '+sc+'">'+(r.status_text||'未知')+'</span></td>'+
                        '<td><small>'+(r.admin_remark||'-')+'</small></td>'+
                        '<td><small>'+(r.create_date||'-')+'</small></td>'+
                        '<td>'+actions+'</td></tr>';
                }
            }
            document.getElementById('tableBody').innerHTML = html;
            rcRenderPage(d.total||0, rcPage, 20);
        } catch(e){
            document.getElementById('tableBody').innerHTML='<tr><td colspan="12" style="color:red;">解析错误: '+rcEscape(e.message)+'</td></tr>';
        }
    };
    xhr.send();
}

function rcEscape(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});
}

function rcOpenChat(userId){
    var path = window.location.pathname, match = path.match(/(\/[^\/]*\.php)/i);
    var url = (match ? match[1] : '/index.php') + '/lottery/kefu?channel=general&user_id=' + encodeURIComponent(userId);
    var dialog = window.parent && window.parent.layer ? window.parent.layer : window.layer;
    if(dialog) dialog.open({type:2,title:'<i class="fa fa-comments"></i> 用户在线会话',shadeClose:true,maxmin:true,area:['900px','750px'],content:url});
    else window.open(url, '_blank');
}

function rcAudit(id, action){
    var remark = '';

    var fd = new FormData();
    fd.append('id', id);
    fd.append('action', action);
    fd.append('remark', remark);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', location.pathname.replace(/\/index$/i, '/audit'), true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onload = function(){
        try { var res=JSON.parse(xhr.responseText); document.title=res.msg; rcLoadList(rcPage); }
        catch(e){ document.title='操作失败:'+xhr.responseText.substring(0,200); }
    };
    xhr.send(fd);
}

function rcShowProof(url){
    document.getElementById('proofImg').src = url;
    var overlay = document.getElementById('proofOverlay');
    overlay.style.display = 'flex';
}

function rcRenderPage(total, page, limit){
    var pages = Math.ceil(total / limit), html = '';
    if(pages <= 1){ document.getElementById('pagination').innerHTML=''; return; }
    for(var i=1;i<=pages;i++){
        html += '<button class="btn btn-sm '+(i===page?'btn-primary':'btn-default')+'" onclick="rcLoadList('+i+')" style="margin:2px;">'+i+'</button>';
    }
    document.getElementById('pagination').innerHTML = '<div>共'+total+'条 '+html+'</div>';
}

window.rcLoadList = rcLoadList;
window.rcAudit = rcAudit;
window.rcShowProof = rcShowProof;
window.rcRenderPage = rcRenderPage;
window.rcOpenChat = rcOpenChat;

rcLoadList();
</script>
