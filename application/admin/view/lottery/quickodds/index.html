<div class="panel panel-default"><div class="panel-heading">快译玩法赔率（全部彩种共用）</div><div class="panel-body"><p>所有彩种共用此处的玩法说明、赔率与启停。修改后，前台未提交的注单必须重新核对。赔率为每投注 1 元中奖返还金额。</p><div id="quickOddsRows">加载中...</div></div></div>
<script>function qe(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function loadQuickOdds(){fetch(location.pathname+location.search,{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'}).then(function(r){return r.json()}).then(function(r){if(r.code!==1)throw Error(r.msg||'读取失败');document.getElementById('quickOddsRows').innerHTML='<div class="table-responsive"><table class="table table-striped"><tr><th>玩法</th><th>赔率</th><th>玩法说明</th><th>状态</th><th>操作</th></tr>'+r.data.rows.map(function(x){return '<tr><td>'+qe(r.data.catalog[x.play_code]||x.play_code)+'</td><td><input id="rate'+x.id+'" type="number" min="0.0001" step="0.0001" value="'+qe(x.odds)+'"></td><td><input id="desc'+x.id+'" value="'+qe(x.description)+'"></td><td><select id="status'+x.id+'"><option value="0"'+(x.status==0?' selected':'')+'>停用</option><option value="1"'+(x.status==1?' selected':'')+'>启用</option></select></td><td><button class="btn btn-primary" onclick="saveQuickOdds('+x.id+')">保存</button></td></tr>'}).join('')+'</table></div>'}).catch(function(e){document.getElementById('quickOddsRows').textContent='加载失败：'+e.message})}function saveQuickOdds(id){var f=new FormData();f.append('id',id);f.append('odds',document.getElementById('rate'+id).value);f.append('description',document.getElementById('desc'+id).value);f.append('status',document.getElementById('status'+id).value);fetch(location.pathname.replace(/(?:\/index)?(?:\.html)?\/?$/,'/save'),{method:'POST',body:f,credentials:'same-origin'}).then(function(r){return r.json()}).then(function(r){alert(r.msg);if(r.code===1)loadQuickOdds()}).catch(function(e){alert('保存失败：'+e.message)})}loadQuickOdds();</script>
