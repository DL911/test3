    <script>
        function showToast(msg) {
            var m = document.createElement('div');
            m.className = 'm-toast show';
            m.textContent = msg;
            document.body.appendChild(m);
            setTimeout(function(){ m.remove(); }, 2000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            LotteryApp.initCountdowns();
            loadLatestDraws();
            // Tab 切换过滤
            document.querySelectorAll('.m-type-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.m-type-tab').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    var type = tab.dataset.type;
                    document.querySelectorAll('.m-lottery-card').forEach(function(card) {
                        if (type === 'all' || card.dataset.lottery === type) {
                            card.style.display = '';
                            card.style.animation = 'cardFadeIn 0.3s ease';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        });

        // 颜色映射
        var ballColors = ['purple','cyan','pink','blue','green','orange','red','teal','indigo','amber'];

        function loadLatestDraws() {
            // 加载福彩3D
            fetch('/index.php/api/lottery/getLatestDraw?type=fc3d')
                .then(function(r){ return r.json(); })
                .then(function(res){
                    if(res.code===1 && res.data && res.data.latest) updateCard('fc3d', res.data);
                }).catch(function(){});
            // 加载排列三
            fetch('/index.php/api/lottery/getLatestDraw?type=pl3')
                .then(function(r){ return r.json(); })
                .then(function(res){
                    if(res.code===1 && res.data && res.data.latest) updateCard('pl3', res.data);
                }).catch(function(){});
        }

        function updateCard(type, data) {
            var latest = data.latest;
            var nums = latest.numbers_arr || latest.numbers.split(',');
            var sum = 0;
            for(var i=0;i<nums.length;i++) sum += parseInt(nums[i]);
            var daxiao = sum >= 14 ? '大' : '小';
            var danshuang = sum % 2 === 1 ? '单' : '双';

            // 更新期号
            var periodEl = document.getElementById(type === 'fc3d' ? 'fc3dPeriod' : 'pl3Period');
            if(periodEl) periodEl.textContent = latest.period;

            // 更新开奖号码球
            var numbersEl = document.getElementById(type === 'fc3d' ? 'fc3dNumbers' : 'pl3Numbers');
            if(numbersEl) {
                var html = '';
                for(var j=0;j<nums.length;j++) {
                    var c = ballColors[j % ballColors.length];
                    if(type==='fc3d') c = ['purple','cyan','pink'][j] || c;
                    else c = ['blue','green','orange'][j] || c;
                    html += '<span class="m-num ' + c + '">' + nums[j] + '</span>';
                }
                numbersEl.innerHTML = html;
            }

            // 更新统计
            var card = document.querySelector('.m-lottery-card[data-lottery="'+type+'"]');
            if(card) {
                var statsEl = card.querySelector('.m-card-stats');
                if(statsEl) {
                    statsEl.innerHTML = '<span class="m-stat">\u603b\u548c <strong>' + sum + '</strong></span>' +
                        '<span class="m-stat ' + (daxiao==='大'?'red':'blue') + '">' + daxiao + '</span>' +
                        '<span class="m-stat ' + (danshuang==='单'?'red':'blue') + '">' + danshuang + '</span>';
                }
            }
        }
    </script>

    <!-- 轮播图 JS -->
    <script>
    (function(){
        var idx=0, cnt=0, timer=null, startX=0;
        fetch('/index.php/api/lottery/banners').then(function(r){return r.json()}).then(function(res){
            if(res.code!==1||!res.data||!res.data.length) return;
            var list=res.data; cnt=list.length;
            var track=document.getElementById('mBannerTrack'), dots=document.getElementById('mBannerDots');
            var h='', d='';
            list.forEach(function(b,i){
                h+='<div class="m-banner-slide"'+(b.url?' onclick="window.location.href=\''+b.url+'\'"':'')+'>'; 
                h+='<img src="/thumb.php?src='+encodeURIComponent(b.image)+'&w=800&q=72" alt="'+(b.title||'')+'" loading="lazy"></div>';
                d+='<span class="m-banner-dot'+(i===0?' active':'')+'"></span>';
            });
            track.innerHTML=h; dots.innerHTML=d;
            document.getElementById('mBanner').style.display='';
            if(cnt>1) timer=setInterval(function(){go((idx+1)%cnt);},4000);

            // 触摸滑动
            track.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;},{passive:true});
            track.addEventListener('touchend',function(e){
                var dx=e.changedTouches[0].clientX-startX;
                if(Math.abs(dx)>40){ go(dx<0?(idx+1)%cnt:(idx-1+cnt)%cnt); }
            });
        });
        function go(i){
            idx=i;
            document.getElementById('mBannerTrack').style.transform='translateX(-'+(i*100)+'%)';
            var dots=document.querySelectorAll('.m-banner-dot');
            dots.forEach(function(d,j){d.classList.toggle('active',j===i);});
            if(timer){clearInterval(timer);timer=setInterval(function(){go((idx+1)%cnt);},4000);}
        }
    })();
    </script>
