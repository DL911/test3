<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在线客服 - 好运北彩</title>
    <link rel="stylesheet" href="/assets/lottery/css/mobile_light.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.light-mobile {
            background-color: #f5f7fa;
            padding-bottom: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            flex-shrink: 0;
            background: var(--m-primary-grad);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .chat-header .back {
            position: absolute;
            left: 16px;
            font-size: 20px;
            color: white;
            cursor: pointer;
        }
        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .channel-select { flex-shrink:0; display:flex; gap:8px; padding:8px 10px; background:#fff; overflow-x:auto; }
        .channel-select a { white-space:nowrap; padding:6px 12px; border:1px solid #ddd; border-radius:16px; color:#666; text-decoration:none; font-size:13px; }
        .channel-select a.active { background:#18bc9c; color:#fff; border-color:#18bc9c; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-message {
            display: flex;
            max-width: 85%;
            margin-bottom: 8px;
        }
        .chat-message.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .chat-message.other {
            align-self: flex-start;
        }
        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            margin: 0 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chat-avatar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-avatar-name {
            font-size: 10px;
            color: #999;
            margin-top: 3px;
            white-space: nowrap;
            max-width: 56px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .chat-message.other .chat-avatar-name {
            color: #ff4d4f;
            font-weight: 600;
        }
        .chat-message.me .chat-avatar {
            background-color: var(--m-primary);
            color: white;
        }
        .chat-message.other .chat-avatar {
            background-color: #ff4d4f;
            color: white;
        }
        .chat-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            word-break: break-all;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chat-message.me .chat-bubble {
            background-color: var(--m-primary);
            color: white;
            border-top-right-radius: 4px;
        }
        .chat-message.other .chat-bubble {
            background-color: white;
            color: var(--m-text);
            border-top-left-radius: 4px;
        }
        .chat-time {
            font-size: 11px;
            color: #ccc;
            margin-top: 4px;
            text-align: right;
        }
        .chat-message.other .chat-time {
            text-align: left;
            color: #999;
        }
        .chat-input-area {
            flex-shrink: 0;
            background: white;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--m-border);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .chat-input {
            flex: 1;
            background: var(--m-bg);
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus {
            background: #fff;
            box-shadow: 0 0 0 2px rgba(0,82,217,0.2);
        }
        .send-btn {
            background: var(--m-primary-grad);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
            flex-shrink: 0;
        }
        .send-btn:active {
            transform: scale(0.9);
        }
        .send-btn:disabled {
            filter: grayscale(1);
            opacity: 0.5;
        }
        .system-msg {
            align-self: center;
            background: rgba(0,0,0,0.05);
            color: #888;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 8px 0;
        }
        .chat-bubble img {
            max-width: 180px;
            max-height: 180px;
            border-radius: 8px;
            display: block;
            cursor: pointer;
        }
        .img-btn {
            background: none;
            border: none;
            color: var(--m-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
        }
        .img-btn:active { opacity: 0.6; }
    </style>
</head>
<body class="light-mobile">

    <!-- 顶部栏 -->
    <div class="chat-header">
        <a href="javascript:history.back();" class="back"><i class="fa-solid fa-angle-left"></i></a>
        <h1 id="channelTitle">在线客服</h1>
    </div>
    <div class="channel-select" id="channelSelect"></div>

    <!-- 聊天内容区 -->
    <div class="chat-container" id="chatContainer">
        <div class="system-msg">官方人工客服为您服务</div>
        <!-- 消息将通过JS渲染在这里 -->
    </div>

    <!-- 输入区 -->
    <div class="chat-input-area">
        <button class="img-btn" id="imgBtn"><i class="fa-solid fa-image"></i></button>
        <input type="file" id="imgUpload" accept="image/*" style="display:none;">
        <input type="text" id="msgInput" class="chat-input" placeholder="输入你想咨询的问题..." autocomplete="off">
        <button id="sendBtn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

<script src="/assets/lottery/js/auth.js"></script>
<script>
    if (!LotteryAuth.isLoggedIn()) {
        window.location.href = '/index.php/index/lottery/login';
    }

    const chatContainer = document.getElementById('chatContainer');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    let lastId = 0;
    let isPolling = false;
    let pollInterval = null;

    // 格式化时间
    function formatTime(timestamp) {
        const date = new Date(timestamp * 1000);
        const h = date.getHours().toString().padStart(2, '0');
        const m = date.getMinutes().toString().padStart(2, '0');
        return `${h}:${m}`;
    }

    // 滚动到底部
    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 渲染单条消息
    function renderMessage(msg) {
        const isMe = msg.sender_type === 'user';
        const timestamp = msg.createtime || Math.floor(Date.now()/1000);
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-message ${isMe ? 'me' : 'other'}`;
        
        const avatarIcon = isMe ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-headset"></i>';
        const avatarName = isMe ? '我' : '好运北彩';
        
        msgDiv.innerHTML = `
            <div class="chat-avatar-wrap">
                <div class="chat-avatar">${avatarIcon}</div>
                <div class="chat-avatar-name">${avatarName}</div>
            </div>
            <div>
                <div class="chat-bubble">
                    ${parseContent(msg.content)}
                </div>
                <div class="chat-time">${formatTime(timestamp)}</div>
            </div>
        `;
        
        chatContainer.appendChild(msgDiv);
        
        if (msg.id && msg.id > lastId) {
            lastId = parseInt(msg.id);
        }
    }

    var currentChannel = new URLSearchParams(location.search).get('channel') || 'general';
    var channelQuery = 'channel=' + encodeURIComponent(currentChannel);
    // 加载历史记录
    function loadHistory() {
        LotteryAuth.request('/index.php/api/kefu/history?' + channelQuery, {
            method: 'GET'
        }).then(res => {
            if (res.code === 1 && res.data && res.data.list) {
                res.data.list.forEach(msg => {
                    renderMessage(msg);
                });
                scrollToBottom();
                startPolling(); // 加载完历史记录后开始轮询
            }
        });
    }

    // 发送消息
    function sendMessage() {
        const content = msgInput.value.trim();
        if (!content) return;
        
        msgInput.value = '';
        msgInput.focus();
        sendBtn.disabled = true;

        // 乐观UI
        renderMessage({
            sender_type: 'user',
            content: content,
            createtime: Math.floor(Date.now()/1000)
        });
        scrollToBottom();

        LotteryAuth.request('/index.php/api/kefu/send', {
            method: 'POST',
            body: JSON.stringify({ content: content, channel: currentChannel })
        }).then(res => {
            sendBtn.disabled = false;
            if (res.code === 1) {
                if (res.data && res.data.id && res.data.id > lastId) {
                    lastId = res.data.id;
                }
            } else {
                alert(res.msg || '发送失败');
            }
        }).catch(err => {
            sendBtn.disabled = false;
        });
    }

    // 轮询新消息
    function pollMessages() {
        if (isPolling) return;
        isPolling = true;
        
        LotteryAuth.request('/index.php/api/kefu/poll?last_id=' + lastId + '&' + channelQuery, {
            method: 'GET'
        }).then(res => {
            isPolling = false;
            if (res.code === 1 && res.data && res.data.list && res.data.list.length > 0) {
                let hasNewOtherMsg = false;
                res.data.list.forEach(msg => {
                    if (parseInt(msg.id) > lastId) {
                        // 如果我方乐观渲染的消息服务端已经返回，避免重复渲染
                        // 由于简易实现乐观UI无法获取id，通常以最后更新的lastId做遮蔽。
                        // 如果有更好的方案是通过本地UUID比对。目前的简单实现是，如果sender_type是user，这里也显示的话会重复
                        // 因此我们在poll这里只处理admin发来的消息
                        if (msg.sender_type === 'admin') {
                            renderMessage(msg);
                            hasNewOtherMsg = true;
                        } else if(parseInt(msg.id) > lastId) {
                             lastId = parseInt(msg.id); // 更新lastId哪怕不重复渲染
                        }
                    }
                });
                if (hasNewOtherMsg) {
                    scrollToBottom();
                }
            }
        }).catch(() => {
            isPolling = false;
        });
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(pollMessages, 3000); // 3秒轮询一次新消息
    }

    // 解析消息内容（图片标签转 HTML）
    function parseContent(content) {
        if (!content) return '';
        var imgMatch = content.match(/^\[img\](.*?)\[\/img\]$/);
        if (imgMatch) {
            return '<img src="' + imgMatch[1] + '" onclick="window.open(this.src)">';
        }
        return content;
    }

    // 事件监听
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // 图片上传
    document.getElementById('imgBtn').addEventListener('click', function() {
        document.getElementById('imgUpload').click();
    });
    document.getElementById('imgUpload').addEventListener('change', function() {
        var file = this.files[0];
        if (!file) return;
        var formData = new FormData();
        formData.append('file', file);

        var token = LotteryAuth.getToken();
        fetch('/index.php/api/kefu/uploadImage', {
            method: 'POST',
            headers: { 'token': token },
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code === 1 && res.data && res.data.url) {
                var imgContent = '[img]' + res.data.url + '[/img]';
                // 乐观UI
                renderMessage({
                    sender_type: 'user',
                    content: imgContent,
                    createtime: Math.floor(Date.now()/1000)
                });
                scrollToBottom();
                // 发送到服务器
                LotteryAuth.request('/index.php/api/kefu/send', {
                    method: 'POST',
                    body: JSON.stringify({ content: imgContent, channel: currentChannel })
                }).then(function(r) {
                    if (r.code === 1 && r.data && r.data.id > lastId) {
                        lastId = r.data.id;
                    }
                });
            } else {
                alert(res.msg || '图片上传失败');
            }
        })
        .catch(function() { alert('图片上传失败'); });
        this.value = '';
    });

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/index.php/api/kefu/channels').then(r=>r.json()).then(res=>{
            let html=''; (res.data&&res.data.list||[]).forEach(c=>{if(c.code===currentChannel) document.getElementById('channelTitle').textContent=c.name; html+='<a class="'+(c.code===currentChannel?'active':'')+'" href="?channel='+encodeURIComponent(c.code)+'">'+c.name+'</a>';}); document.getElementById('channelSelect').innerHTML=html;
        });
        loadHistory();
    });

    // 页面不可见时减缓轮询
    document.addEventListener("visibilitychange", function() {
        if (document.hidden) {
            clearInterval(pollInterval);
        } else {
            pollMessages();
            startPolling();
        }
    });

</script>
</body>
</html>
