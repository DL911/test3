    function loadRecords(reset) {
        if(!LotteryAuth.isLoggedIn()) {
            document.getElementById('recList').innerHTML = '<div class="rec-empty"><i class="fa-solid fa-lock"></i>请先登录查看记录</div>';
            return;
        }
        var url = '/index.php/api/lottery/getBetHistory?page='+curPage+'&limit=20';
        if(curType) url += '&type='+curType;
        if(curFilterTime) url += '&time='+curFilterTime;
        if(curFilterStatus !== '') url += '&status='+curFilterStatus;

        LotteryAuth.request(url, {method:'GET'}).then(function(res){
            if(res.code !== 1) return;
            var data = res.data;
            var list = data.list || [];

            if(reset) {
                allRecords = list;
                updateSummary(data.total, list, data);
            } else {
                allRecords = allRecords.concat(list);
            }

            hasMore = allRecords.length < data.total;
            document.getElementById('loadMore').style.display = hasMore ? '' : 'none';
            renderList(reset ? list : allRecords, reset);
        });
    }

    function updateSummary(total, list, data) {
        document.getElementById('sumTotal').textContent = total;
        // 使用后端返回的全量统计
        var winAmount = (data && data.win_amount !== undefined) ? data.win_amount : 0;
        var totalAmount = (data && data.sum_amount !== undefined) ? data.sum_amount : 0;
        document.getElementById('sumWin').textContent = '¥' + parseFloat(winAmount).toFixed(2);
        document.getElementById('sumAmount').textContent = '¥' + parseFloat(totalAmount).toFixed(0);
    }

            'ge_da':'个大','ge_xiao':'个小','ge_dan':'个单','ge_shuang':'个双','ge_zhi':'个质','ge_he':'个合',
            // 两位和值 大小单双质合
            'baishi_heda':'百十大','baishi_hexiao':'百十小','baishi_hedan':'百十单','baishi_heshuang':'百十双','baishi_hezhi':'百十质','baishi_hehe':'百十合',
            'baige_heda':'百个大','baige_hexiao':'百个小','baige_hedan':'百个单','baige_heshuang':'百个双','baige_hezhi':'百个质','baige_hehe':'百个合',
            'shige_heda':'十个大','shige_hexiao':'十个小','shige_hedan':'十个单','shige_heshuang':'十个双','shige_hezhi':'十个质','shige_hehe':'十个合',
            // 总和 和数尾 大小单双质合
            'zonghe_heweida':'总和尾大','zonghe_heweixiao':'总和尾小','zonghe_heweidan':'总和尾单','zonghe_heweishuang':'总和尾双','zonghe_heweizhi':'总和尾质','zonghe_heweihe':'总和尾合',
            // 两位 和数尾 大小单双质合
            'baishi_heweida':'百十尾大','baishi_heweixiao':'百十尾小','baishi_heweidan':'百十尾单','baishi_heweishuang':'百十尾双','baishi_heweizhi':'百十尾质','baishi_heweihe':'百十尾合',
            'baige_heweida':'百个尾大','baige_heweixiao':'百个尾小','baige_heweidan':'百个尾单','baige_heweishuang':'百个尾双','baige_heweizhi':'百个尾质','baige_heweihe':'百个尾合',
            'shige_heweida':'十个尾大','shige_heweixiao':'十个尾小','shige_heweidan':'十个尾单','shige_heweishuang':'十个尾双','shige_heweizhi':'十个尾质','shige_heweihe':'十个尾合'
        };
        var redTags = {'da':1,'dan':1,'long':1,'baozi':1,
            'zonghe_heda':1,'zonghe_hedan':1,'bai_da':1,'bai_dan':1,'shi_da':1,'shi_dan':1,'ge_da':1,'ge_dan':1,
            'baishi_heda':1,'baishi_hedan':1,'baige_heda':1,'baige_hedan':1,'shige_heda':1,'shige_hedan':1,
            'zonghe_heweida':1,'zonghe_heweidan':1,'baishi_heweida':1,'baishi_heweidan':1,'baige_heweida':1,'baige_heweidan':1,'shige_heweida':1,'shige_heweidan':1};

        // 提取号码：从key或num字段获取可读数字
        function extractNum(b) {
            // num字段存在（包括0）
            if (b.num !== undefined && b.num !== null && b.num !== '') return String(b.num);
            var k = b.key || '';
            // p0_5 格式 → 5
            if (/^p\d+_/.test(k)) return k.split('_')[1];
            // bai_5 格式 → 5
            if (/^(bai|shi|ge)_\d+$/.test(k)) return k.split('_')[1];
            return k;
        }

        // 按位分组（用于定位类、复式类）
        // 一字定位: bai_N/shi_N/ge_N 无pos字段，按前缀分组
        if (playType === 'yizi_dingwei') {
            var posGroups = {bai:[], shi:[], ge:[]};
            var posNames2 = {bai:'百', shi:'十', ge:'个'};
            bets.forEach(function(b) {
                var k = b.key || '';
                var m = k.match(/^(bai|shi|ge)_(\d+)$/);
                if (m) posGroups[m[1]].push(m[2]);
            });
            ['bai','shi','ge'].forEach(function(prefix) {
                if (posGroups[prefix].length > 0) {
                    contentHtml += '<span class="bet-tag" style="background:#e8e8e8;color:#666;font-size:10px;margin-right:2px;">' + posNames2[prefix] + '</span>';
                    posGroups[prefix].forEach(function(num) {
                        contentHtml += '<span class="bet-ball">' + num + '</span>';
                    });
                }
            });
            return contentHtml;
        }

        var grouped = {};
        var hasPos = false;
        bets.forEach(function(b) {
            if (b.pos !== undefined && b.pos !== null && b.pos !== '') {
                hasPos = true;
                var p = String(b.pos);
                if (!grouped[p]) grouped[p] = [];
                grouped[p].push(b);
            }
        });

        // 包胆类：pos字段无意义，跳过位置标签直接显示号码
        var noPosLabel = ['he_zuxuan_baodan','qe_zuxuan_baodan','sx_budingdan'];
        if (hasPos && noPosLabel.indexOf(playType) !== -1) {
            bets.forEach(function(b) {
                var num = extractNum(b);
                contentHtml += '<span class="bet-ball">' + num + '</span>';
            });
            return contentHtml;
        }

        // 定位类玩法：按位分组显示（所有有pos字段的玩法都走这里）
        if (hasPos) {
            // 二字定位：根据play_sub确定两个位置名
            var ctxPosLabels = posLabels;
            if (playType === 'erzi_dingwei' && playSub) {
                var erziMap = {'baishi':{'0':'百','1':'十'},'baige':{'0':'百','1':'个'},'shige':{'0':'十','1':'个'}};
                if (erziMap[playSub]) ctxPosLabels = erziMap[playSub];
            }
            // 后二直选/组选：pos0=十位, pos1=个位
            if (playType.indexOf('he_zx') === 0 || playType.indexOf('he_zuxuan') === 0) {
                ctxPosLabels = {'0':'十','1':'个'};
            }
            // 前二直选/组选：pos0=百位, pos1=十位 (和默认一致，显式声明以保险)
            if (playType.indexOf('qe_zx') === 0 || playType.indexOf('qe_zuxuan') === 0) {
                ctxPosLabels = {'0':'百','1':'十'};
            }
            var posOrder = Object.keys(grouped).sort();
            posOrder.forEach(function(p) {
                var label = ctxPosLabels[p] || posLabels[p] || ('位'+p);
                contentHtml += '<span class="bet-tag" style="background:#e8e8e8;color:#666;font-size:10px;margin-right:2px;">'+label+'</span>';
                grouped[p].forEach(function(b) {
                    var num = extractNum(b);
                    if (keyLabels[num]) {
                        contentHtml += '<span class="bet-tag '+(redTags[num]?'red':'blue')+'">'+keyLabels[num]+'</span>';
                    } else {
                        contentHtml += '<span class="bet-ball">'+num+'</span>';
                    }
                });
            });
            return contentHtml;
        }

        // 快捷多选位置：如果item有sub字段，按位置分组展示
        var hasSub = bets.some(function(b){ return !!b.sub; });
        if (hasSub && playType === 'kuaijie') {
            var subLabels = {baiwei:'百',shiwei:'十',gewei:'个',bai:'百',shi:'十',ge:'个'};
            var subGroups = {};
            bets.forEach(function(b) {
                var s = b.sub || 'other';
                if (!subGroups[s]) subGroups[s] = [];
                subGroups[s].push(b);
            });
            Object.keys(subGroups).forEach(function(s) {
                var label = subLabels[s] || s;
                contentHtml += '<span class="bet-tag" style="background:#e8e8e8;color:#666;font-size:10px;margin-right:2px;">'+label+'</span>';
                subGroups[s].forEach(function(b) {
                    var k = b.key || '';
                    var displayK = k.replace(/^num_/, '');
                    if (keyLabels[displayK]) {
                        contentHtml += '<span class="bet-tag '+(redTags[displayK]?'red':'blue')+'">'+keyLabels[displayK]+'</span>';
                    } else if (keyLabels[k]) {
                        contentHtml += '<span class="bet-tag '+(redTags[k]?'red':'blue')+'">'+keyLabels[k]+'</span>';
                    } else {
                        contentHtml += '<span class="bet-ball">'+displayK+'</span>';
                    }
                });
            });
            return contentHtml;
        }

        // 非定位类
        var items = bets.slice(0, 15);
        items.forEach(function(b){
            var k = b.label || b.key || b.number || b.value || '';
            // hzws_5 格式 → 和尾5 (三字和数尾数，必须在 hz_ 之前判断)
            if (k.indexOf('hzws_') === 0) {
                contentHtml += '<span class="bet-tag">和尾' + k.replace('hzws_','') + '</span>';
            }
            // hz_5 格式 → 和值5
            else if (k.indexOf('hz_') === 0) {
                contentHtml += '<span class="bet-tag">和' + k.replace('hz_','') + '</span>';
            }
            // kd_5 格式 → 跨度5
            else if (k.indexOf('kd_') === 0) {
                contentHtml += '<span class="bet-tag">跨' + k.replace('kd_','') + '</span>';
            }
            // ehzws_5 格式 → 和数尾5 (必须在 ehz_ 之前判断)
            else if (k.indexOf('ehzws_') === 0) {
                contentHtml += '<span class="bet-tag">和尾' + k.replace('ehzws_','') + '</span>';
            }
            // ehz_5 / ehz_0-4 格式 → 和5 / 和0-4
            else if (k.indexOf('ehz_') === 0) {
                contentHtml += '<span class="bet-tag">和' + k.replace('ehz_','') + '</span>';
            }
            // p0_5 格式 → 5
            else if (/^p\d+_/.test(k)) {
                contentHtml += '<span class="bet-ball">' + k.split('_')[1] + '</span>';
            }
            // num_5 格式 → 5
            else if (k.indexOf('num_') === 0) {
                contentHtml += '<span class="bet-ball">' + k.replace('num_','') + '</span>';
            }
            // yz_5 格式 → 5 (一字组合)
            else if (/^yz_\d$/.test(k)) {
                contentHtml += '<span class="bet-ball">' + k.replace('yz_','') + '</span>';
            }
            // ez_05 格式 → 05 (二字组合)
            else if (/^ez_\d+$/.test(k)) {
                contentHtml += '<span class="bet-ball">' + k.replace('ez_','') + '</span>';
            }
            // sz_012 格式 → 012 (三字组合)
            else if (/^sz_\d+$/.test(k)) {
                contentHtml += '<span class="bet-ball">' + k.replace('sz_','') + '</span>';
            }
            // bai_5 / shi_3 / ge_7 格式 → 百5 / 十3 / 个7
            else if (/^(bai|shi|ge)_\d+$/.test(k)) {
                var posMap = {bai:'百',shi:'十',ge:'个'};
                var parts = k.split('_');
                contentHtml += '<span class="bet-ball">' + (posMap[parts[0]]||'') + parts[1] + '</span>';
            }
            // 大小单双等标签
            else if (keyLabels[k]) {
                contentHtml += '<span class="bet-tag '+(redTags[k]?'red':'blue')+'">' + keyLabels[k] + '</span>';
            }
            // 纯数字
            else if (/^\d+$/.test(k)) {
                contentHtml += '<span class="bet-ball">' + k + '</span>';
            }
            // 带金额的行式
            else if (b.amount) {
                var displayK = keyLabels[k] || k;
                contentHtml += '<span class="bet-tag">' + displayK + ' ¥' + b.amount + '</span>';
            }
            // 其他
            else {
                contentHtml += '<span class="bet-tag">' + (keyLabels[k] || k) + '</span>';
            }
        });
        if (bets.length > 15) contentHtml += '<span class="bet-tag">+' + (bets.length-15) + '</span>';
        return contentHtml;
    }

    function renderList(list, reset) {
        var container = document.getElementById('recList');
        if(reset) container.innerHTML = '';
        if(!list.length) {
            container.innerHTML = '<div class="rec-empty"><i class="fa-solid fa-receipt"></i>暂无投注记录</div>';
            return;
        }

        var html = '';
        list.forEach(function(r){
            var typeName = typeNames[r.lottery_type] || '未知';
            var typeCls = typeClass[r.lottery_type] || 'fc3d';
            var playName = playNames[r.play_type] || r.play_type;
            var subName = playNames[r.play_sub] || r.play_sub || '';
            // play_sub 白名单：只有真正按位区分的玩法才显示位置标签
            // 其他玩法的 play_sub='baiwei' 是前端面板默认值，不应显示
            var showSubPlays = ['erzi_dingwei','erzi_heshu','dingweidan','kuaijie'];
            if (showSubPlays.indexOf(r.play_type) === -1) subName = '';

            var statusText = '', statusCls = '';
            if(r.status == 0) { statusText = '待开奖'; statusCls = 'pending'; }
            else if(r.status == 1) { statusText = '已中奖'; statusCls = 'win'; }
            else if(r.status == 2) { statusText = '未中奖'; statusCls = 'lose'; }
            else if(r.status == 3) { statusText = '已撤单'; statusCls = 'cancel'; }
            else { statusText = '已结算'; statusCls = 'lose'; }

            var winAmount = parseFloat(r.win_amount) || 0;
            var amountCls = r.status == 1 ? 'green' : (r.status == 0 ? 'gray' : (r.status == 3 ? 'gray' : 'red'));
            var amountText = r.status == 0 ? '待开奖' : (r.status == 1 ? '+¥'+winAmount.toFixed(2) : (r.status == 3 ? '已退款' : '-¥'+(parseFloat(r.total_amount)||0).toFixed(2)));

            // 解析投注内容
            var contentHtml = '';
            try {
                var bets = JSON.parse(r.bet_content);
                if(Array.isArray(bets)) {
                    contentHtml = formatBetContent(bets, r.play_type, r.play_sub);
                }
            } catch(e) { contentHtml = r.bet_content || ''; }

            // 开奖号码
            var drawNums = '';
            if(r.draw_numbers) {
                var nums = r.draw_numbers.split(',');
                var ballColors = ['ball-0','ball-1','ball-2'];
                drawNums += '<span style="font-size:10px;color:#aaa;margin-right:2px;">开奖</span>';
                nums.forEach(function(n, idx){ drawNums += '<span class="rec-draw-num '+(ballColors[idx]||'ball-0')+'">'+n.trim()+'</span>'; });
            }

            var time = r.createtime ? new Date(r.createtime * 1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

            html += '<div class="rec-card'+(r.status==3?' cancelled':'')+'">';
            html += '<div class="rec-card-top">';
            html += '<div class="rec-type"><span class="rec-type-icon '+typeCls+'"><img src="/thumb.php?src=/c788ffd04d7bbafa657bd2dcf4c6ecc4.png&w=200&q=80" style="width:100%;height:100%;object-fit:contain;"></span>';
            html += '<div><div class="rec-type-name">'+typeName+'</div><div class="rec-period">第'+r.period+'期</div></div></div>';
            html += '<span class="rec-status '+statusCls+'">'+statusText+'</span>';
            html += '</div>';
            html += '<div class="rec-card-body">';
            html += '<div class="rec-info">';
            html += '<div class="rec-play">'+playName+(subName?' · '+subName:'')+'</div>';
            html += '<div class="rec-content">' + contentHtml + '</div>';
            if(drawNums) html += '<div class="rec-draw-nums">开奖: '+drawNums+'</div>';
            html += '</div>';
            html += '<div class="rec-amount-wrap">';
            html += '<div class="rec-bet-amount">投注 ¥'+(parseFloat(r.total_amount)||0).toFixed(2)+'</div>';
            html += '<div class="rec-win-amount '+amountCls+'">'+amountText+'</div>';
            html += '</div>';
            html += '</div>';
            html += '<div class="rec-time">'+time+'</div>';
            // 操作按钮 (撤单功能已被移除)
            /* 
            if(r.status == 0) {
                html += '<div class="rec-actions">';
                html += '<button class="rec-btn rec-btn-cancel" onclick="cancelBet('+r.id+',this)"><i class="fa-solid fa-xmark"></i> 撤单</button>';
                html += '</div>';
            }
            */
            html += '</div>';
        });

        if(reset) container.innerHTML = html;
        else container.innerHTML = html;
    }

    function loadMore() {
        curPage++;
        loadRecords(false);
    }

    function cancelBet(betId, btn) {
        btn.disabled = true;
        btn.textContent = '处理中...';
        var fd = new FormData();
        fd.append('bet_id', betId);
        LotteryAuth.request('/index.php/api/lottery/cancelBet', {method:'POST', body:fd}).then(function(res){
            if(res.code === 1) {
                alert(res.msg);
                curPage = 1;
                loadRecords(true);
            } else {
                alert(res.msg || '撤单失败');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-xmark"></i> 撤单';
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function(){
        loadRecords(true);
    });
    </script>
