<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请中心</title>
<style>body{font-family:Arial,sans-serif;background:#f3f6fa;color:#17324a;margin:0}.wrap{max-width:760px;margin:32px auto;padding:16px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 3px 18px #0001}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}button{padding:12px 20px;border:0;border-radius:8px;background:#1677ff;color:white;margin-top:12px;cursor:pointer}.hint{color:#64748b;line-height:1.6}</style></head><body><main class="wrap"><p><a href="/index.php/index/lottery/user">← 返回个人中心</a></p><div class="card"><h1>邀请中心</h1><p class="hint">仅邀请体系账号可使用。直属下级的有效投注按后台比例产生邀请奖励，次日可在返水中心领取。</p><p>直属邀请人数：<strong id="count">--</strong>　已领取邀请奖励：<strong id="claimed">--</strong></p><label for="url">专属邀请链接</label><input id="url" readonly><button id="copy">复制邀请链接</button><p id="error" role="alert"></p><p><a href="/index.php/index/lottery/xima">查看奖励与领取</a></p></div></main>
<script src="/assets/lottery/js/auth.js"></script><script>(function(){LotteryAuth.request('/index.php/api/invite/summary',{method:'GET'}).then(function(r){if(r.code!==1)throw Error(r.msg||'加载失败');var d=r.data||{};document.getElementById('url').value=d.invite_url||'';document.getElementById('count').textContent=d.direct_count||0;document.getElementById('claimed').textContent='¥'+Number(d.claimed||0).toFixed(2);}).catch(function(e){document.getElementById('error').textContent=e.message;});document.getElementById('copy').onclick=function(){var v=document.getElementById('url').value;if(v)navigator.clipboard.writeText(v).then(function(){alert('已复制');});};})();</script></body></html>
