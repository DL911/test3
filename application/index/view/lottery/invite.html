<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请中心</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fa;color:#17324a;margin:0}
.wrap{max-width:760px;margin:32px auto;padding:16px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 3px 18px #0001}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:12px 20px;border:0;border-radius:8px;background:#1677ff;color:white;margin-top:12px;cursor:pointer}
.hint{color:#64748b;line-height:1.6}.qr-area{text-align:center;margin:24px auto;max-width:320px}
.qr-area img{display:block;width:100%;max-width:280px;height:auto;margin:0 auto;border:1px solid #e2e8f0;border-radius:8px;padding:10px;box-sizing:border-box;background:#fff}
.qr-area .hint{font-size:13px;margin:10px 0}#qrGenerator{position:absolute;left:-9999px;top:0}
.qr-area [hidden]{display:none!important}
.actions{display:flex;gap:10px;flex-wrap:wrap}#error{color:#c53030}
@media(max-width:480px){.wrap{margin:12px auto}.card{padding:18px}.actions button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<p><a href="/index.php/index/lottery/user">← 返回个人中心</a></p>
<div class="card">
<h1>邀请中心</h1>
<p class="hint">仅邀请体系账号可使用。直属下级的有效投注按后台比例产生邀请奖励，次日可在返水中心领取。</p>
<p>直属邀请人数：<strong id="count">--</strong>　已领取邀请奖励：<strong id="claimed">--</strong></p>
<label for="url">专属邀请链接</label><input id="url" readonly>
<div class="actions"><button id="copy" type="button">复制邀请链接</button></div>
<div class="qr-area">
<strong>扫码邀请注册</strong>
<div id="qrGenerator" aria-hidden="true"></div>
<p id="qrLoading" class="hint">二维码生成中…</p>
<img id="qrImage" alt="专属邀请注册链接二维码" hidden>
<p class="hint">手机可长按二维码保存或分享，电脑可点击下载。</p>
<button id="downloadQr" type="button" hidden>下载二维码</button>
</div>
<p id="error" role="alert"></p>
<p><a href="/index.php/index/lottery/xima">查看奖励与领取</a></p>
</div>
</main>
<script src="/assets/lottery/js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
    var urlInput=document.getElementById('url');
    var qrImage=document.getElementById('qrImage');
    var qrLoading=document.getElementById('qrLoading');
    var downloadQr=document.getElementById('downloadQr');
    var error=document.getElementById('error');
    LotteryAuth.request('/index.php/api/invite/summary',{method:'GET'}).then(function(r){
        if(r.code!==1)throw Error(r.msg||'加载失败');
        var d=r.data||{};
        if(!d.invite_url)throw Error('暂无可用邀请链接');
        urlInput.value=d.invite_url;
        document.getElementById('count').textContent=d.direct_count||0;
        document.getElementById('claimed').textContent='¥'+Number(d.claimed||0).toFixed(2);
        if(typeof QRCode==='undefined')throw Error('二维码组件加载失败，请先复制邀请链接');
        var container=document.getElementById('qrGenerator');
        new QRCode(container,{text:d.invite_url,width:280,height:280,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
        setTimeout(function(){
            var canvas=container.querySelector('canvas');
            var image=container.querySelector('img');
            var dataUrl=canvas?canvas.toDataURL('image/png'):(image?image.src:'');
            if(!dataUrl){qrLoading.textContent='二维码生成失败，请复制邀请链接';return;}
            qrImage.src=dataUrl;
            qrImage.hidden=false;
            qrLoading.hidden=true;
            downloadQr.hidden=false;
            downloadQr.onclick=function(){var a=document.createElement('a');a.href=dataUrl;a.download='invite-qrcode.png';document.body.appendChild(a);a.click();a.remove();};
        },300);
    }).catch(function(e){error.textContent=e.message;qrLoading.textContent='暂无法显示二维码';});
    document.getElementById('copy').onclick=function(){
        var value=urlInput.value;if(!value)return;
        if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(value).then(function(){alert('已复制');},function(){urlInput.select();document.execCommand('copy');alert('已复制');});
        }else{urlInput.select();document.execCommand('copy');alert('已复制');}
    };
})();
</script>
</body>
</html>
