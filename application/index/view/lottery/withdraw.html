<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提现 - 好运北彩</title>
    <link rel="stylesheet" href="/assets/lottery/css/mobile_light.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mobile">

    <div class="lm-topbar">
        <a class="back" href="/index.php/index/lottery/user"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>提现</h2>
    </div>

    <div class="lm-safe-bottom" id="pageContent" style="display:none;">
        <div class="lm-balance-card">
            <div class="lm-balance-label">可提现余额</div>
            <div class="lm-balance-value" id="wdBalance">¥0.00</div>
        </div>

        <!-- 提现方式 -->
        <div class="lm-pay-tabs">
            <div class="lm-pay-tab active" data-type="wechat" onclick="selWd('wechat')"><i class="lm-pay-icon wechat fa-brands fa-weixin"></i><span class="lm-pay-name">微信</span></div>
            <div class="lm-pay-tab" data-type="alipay" onclick="selWd('alipay')"><i class="lm-pay-icon alipay fa-brands fa-alipay"></i><span class="lm-pay-name">支付宝</span></div>
            <div class="lm-pay-tab" data-type="usdt" onclick="selWd('usdt')"><i class="lm-pay-icon usdt fa-solid fa-coins"></i><span class="lm-pay-name">USDT</span></div>
        </div>

        <div class="lm-card">
            <!-- USDT 地址输入（仅 USDT 提现时显示） -->
            <div id="mWdAddrBox" style="display:none;margin-bottom:14px;">
                <div class="lm-label">您的USDT钱包地址</div>
                <input type="text" class="lm-input" id="mWdUsdtAddr" placeholder="请输入USDT地址(TRC20)" style="font-size:14px;">
            </div>
            <div style="margin-bottom:14px;"><div class="lm-label">提现金额</div><input type="number" class="lm-input" id="wdAmount" placeholder="最低 ¥10" style="font-size:20px;font-weight:700;" oninput="updateWdUsdt()"></div>
            <!-- USDT 汇率提示（仅 USDT 提现时显示）-->
            <div id="wdUsdtBox" style="display:none;margin-bottom:14px;padding:10px 12px;background:#fff8e1;border:1px solid #ffe0a3;border-radius:8px;">
                <div style="font-size:13px;color:#b8860b;font-weight:600;display:flex;justify-content:space-between;align-items:center;">
                    <span>预计到账</span>
                    <span style="font-size:16px;">≈ <span id="wdUsdtAmount">0.0000</span> USDT</span>
                </div>
                <div style="font-size:11px;color:#bb9a55;margin-top:5px;line-height:1.5;">
                    提现汇率：1 USDT ≈ <span id="wdUsdtRate">--</span> CNY
                    <span id="wdRateSrc" style="color:#cbb573;"></span><br>
                    <span style="color:#d9821a;">注：提现汇率在实时汇率基础上上浮 0.07</span>
                </div>
            </div>
            <div style="margin-bottom:14px;"><div class="lm-label">收款人姓名</div><input type="text" class="lm-input" id="wdName" placeholder="请输入真实姓名"></div>
            <div>
                <div class="lm-label">上传您的收款码</div>
                <div class="lm-upload" onclick="document.getElementById('qrFile').click()">
                    <i class="fa-solid fa-qrcode" style="display:block;"></i><p>点击上传收款码</p>
                </div>
                <input type="file" id="qrFile" accept="image/*" style="display:none" onchange="previewImg(this,'qrPrev')">
                <div id="qrPrev" style="margin-top:10px;text-align:center;"></div>
            </div>
        </div>

        <div style="padding:0 16px;margin-bottom:12px;">
            <button class="lm-btn lm-btn-primary" id="wdBtn" onclick="submitWd()"><i class="fa-solid fa-arrow-up-from-bracket"></i> 提交提现</button>
        </div>

        <div class="lm-card" id="wdRecordsCard" style="display:none;">
            <div class="lm-card-title" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';"><i class="fa-solid fa-clock-rotate-left"></i> 提现记录</div>
            <div id="wdRecordsList"></div>
        </div>
    </div>
    <div class="lm-toast" id="toast"></div>

<script src="/assets/lottery/js/auth.js"></script>
<script>
var wdType='wechat';
document.addEventListener('DOMContentLoaded',function(){
    if(!LotteryAuth.isLoggedIn()){location.href='/index.php/index/lottery/login';return;}
    fetchWdRate();
    // 实名认证检查
    LotteryAuth.request('/index.php/api/user/verifyStatus',{method:'GET'}).then(function(res){
        var st = (res.data && res.data.status !== undefined) ? res.data.status : -1;
        if(st === 1) {
            document.getElementById('pageContent').style.display='';
            LotteryAuth.fetchUserInfo(function(u){if(u)document.getElementById('wdBalance').textContent=LotteryAuth.formatMoney(u.money);});
            loadWdRecords();
            return;
        }
        var msg = st === 0 ? '您的实名认证正在审核中，请耐心等待' : '请先完成实名认证后才能提现';
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#f5f5f5;">' +
            '<div style="background:#fff;padding:40px;border-radius:16px;text-align:center;width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.1);">' +
            '<i class="fa-solid fa-shield-halved" style="font-size:48px;color:#f59e0b;margin-bottom:16px;display:block;"></i>' +
            '<div style="font-size:20px;font-weight:700;color:#333;margin-bottom:10px;">实名认证提示</div>' +
            '<div style="font-size:14px;color:#666;margin-bottom:24px;line-height:1.6;">' + msg + '</div>' +
            (st === 0 ? '<a href="/index.php/index/lottery/user" style="display:block;padding:12px;border-radius:10px;background:#1890ff;color:#fff;text-decoration:none;font-weight:600;">返回个人中心</a>' :
            '<a href="/index.php/index/lottery/verify" style="display:block;padding:12px;border-radius:10px;background:#1890ff;color:#fff;text-decoration:none;font-weight:600;margin-bottom:10px;">去实名认证</a>' +
            '<a href="/index.php/index/lottery/user" style="display:block;padding:12px;border-radius:10px;background:#f0f0f0;color:#666;text-decoration:none;font-weight:600;">返回个人中心</a>') +
            '</div></div>';
    }).catch(function(){
        LotteryAuth.fetchUserInfo(function(u){if(u)document.getElementById('wdBalance').textContent=LotteryAuth.formatMoney(u.money);});
        loadWdRecords();
    });
});
function selWd(t){
    wdType=t;
    document.querySelectorAll('.lm-pay-tab').forEach(function(el){el.classList.toggle('active',el.dataset.type===t);});
    document.getElementById('wdUsdtBox').style.display = (t==='usdt') ? '' : 'none';
    var addrBox = document.getElementById('mWdAddrBox');
    if (addrBox) addrBox.style.display = (t==='usdt') ? '' : 'none';
    updateWdUsdt();
}

// 提现汇率（= 充值实时汇率 + 0.07）
var wdUsdtRate = 7.27;
function fetchWdRate(){
    fetch('/index.php/api/lottery/getUsdtRate')
    .then(function(r){return r.json();}).then(function(d){
        if(d && d.code === 1 && d.data){
            // 优先用后端返回的提现汇率，否则用充值汇率+0.07兜底
            wdUsdtRate = parseFloat(d.data.withdraw_rate || (parseFloat(d.data.rate)+0.07));
            var rEl=document.getElementById('wdUsdtRate'); if(rEl) rEl.textContent=wdUsdtRate.toFixed(2);
            var sEl=document.getElementById('wdRateSrc'); if(sEl) sEl.textContent=d.data.source?('（'+d.data.source+'）'):'';
            updateWdUsdt();
        }
    }).catch(function(){});
}
function updateWdUsdt(){
    if(wdType!=='usdt') return;
    var cny=parseFloat(document.getElementById('wdAmount').value)||0;
    var usdt = wdUsdtRate>0 ? (cny/wdUsdtRate) : 0;
    var el=document.getElementById('wdUsdtAmount'); if(el) el.textContent=usdt.toFixed(4);
}

function previewImg(input,id){if(input.files&&input.files[0]){var r=new FileReader();r.onload=function(e){document.getElementById(id).innerHTML='<img src="'+e.target.result+'" style="max-width:160px;border-radius:8px;border:1px solid var(--m-border);">';};r.readAsDataURL(input.files[0]);}}
function submitWd(){
    var displayAmt=parseFloat(document.getElementById('wdAmount').value),name=document.getElementById('wdName').value.trim();
    if(!displayAmt||displayAmt<=0){showToast('请输入有效金额','error');return;}
    if(!name){showToast('请输入姓名','error');return;}
    var cnyAmt = LotteryAuth.toCny(displayAmt);
    var minAmt = 10;
    if(cnyAmt < minAmt){showToast('最低提现相当于¥10','error');return;}
    
    var btn=document.getElementById('wdBtn');btn.disabled=true;btn.textContent='提交中...';
    var fd=new FormData();fd.append('amount',cnyAmt);fd.append('withdraw_type',wdType);fd.append('account_name',name);
    if(wdType==='usdt'){var addr=(document.getElementById('mWdUsdtAddr').value||'').trim();if(addr)fd.append('usdt_address',addr);}
    var f=document.getElementById('qrFile').files[0];if(f)fd.append('qr_image',f);
    fetch('/index.php/api/payment/withdraw',{method:'POST',headers:{'token':LotteryAuth.getToken()},body:fd})
    .then(function(r){return r.json();}).then(function(res){
        btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-up-from-bracket"></i> 提交提现';
        if(res.code===1){showToast(res.msg||'提现申请已提交','success');document.getElementById('wdAmount').value='';document.getElementById('wdName').value='';document.getElementById('qrPrev').innerHTML='';setTimeout(function(){location.href='/index.php/index/lottery/user';},2000);}
        else showToast(res.msg||'失败','error');
    }).catch(function(){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-up-from-bracket"></i> 提交提现';showToast('网络错误','error');});
}
function loadWdRecords(){
    document.getElementById('wdRecordsCard').style.display='';
    fetch('/index.php/api/payment/getOrders?type=withdraw',{headers:{'token':LotteryAuth.getToken()}})
    .then(function(r){return r.json();}).then(function(res){
        var list=(res.code===1&&res.data)?res.data.list||[]:[];var el=document.getElementById('wdRecordsList');
        if(!list.length){el.innerHTML='<div class="lm-empty">暂无记录</div>';return;}
        var tn={wechat:'微信',alipay:'支付宝',usdt:'USDT',bank:'银行卡'};
        el.innerHTML=list.map(function(o){var sc=o.status==0?'pending':(o.status==1?'success':'rejected');return '<div class="lm-record-item"><div><div class="lm-record-label"><strong>'+(tn[o.withdraw_type]||o.withdraw_type)+'提现</strong></div><div class="lm-record-time">'+o.create_date+'</div></div><div style="text-align:right;"><div class="lm-record-amount minus">-'+LotteryAuth.formatMoney(o.amount)+'</div><div class="lm-status '+sc+'">'+o.status_text+'</div></div></div>';}).join('');
    });
}
function showToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='lm-toast '+t;e.style.display='block';setTimeout(function(){e.style.display='none';},3000);}
</script>
</body>
</html>
