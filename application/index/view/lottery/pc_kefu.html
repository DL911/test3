<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在线客服 - 好运北彩</title>
<link rel="stylesheet" href="/assets/lottery/css/lottery.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body.lottery-page{background:#f0f2f5}.service-layout{display:flex;padding-top:72px;min-height:100vh}.service-side{width:230px;background:#fff;border-right:1px solid #e7ebf0;padding:22px 0;flex-shrink:0}.service-side-title{padding:0 24px 14px;color:#999;font-size:13px;font-weight:700}.service-link{display:flex;align-items:center;gap:11px;padding:14px 22px;color:#555;text-decoration:none;border-left:3px solid transparent;font-size:14px}.service-link:hover{background:#f4f9ff}.service-link.active{background:#e8f4ff;color:#168fea;border-left-color:#168fea;font-weight:700}.service-main{flex:1;max-width:1120px;padding:24px;margin:0 auto}.notice{display:flex;align-items:center;background:#fff;border-radius:12px;padding:13px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(20,40,80,.05);overflow:hidden}.notice i{color:#ff4d4f;margin-right:12px}.notice-track{overflow:hidden;white-space:nowrap;flex:1}.notice-text{display:inline-block;padding-left:100%;animation:noticeMove 18s linear infinite;color:#f04444}@keyframes noticeMove{to{transform:translateX(-100%)}}
.general-service .service-side,.general-service .notice,.general-service .intro-card{display:none}.general-service .service-main{max-width:760px;padding-top:30px}.general-service .chat-box{height:calc(100vh - 145px);min-height:480px}
.service-content{display:flex;flex-direction:column;gap:18px}.intro-card,.chat-box{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(20,40,80,.06);overflow:hidden}.intro-image{width:100%;max-height:320px;object-fit:cover;display:none}.intro-body{padding:22px;min-height:130px}.intro-body h2{font-size:21px;margin:0 0 12px}.intro-text{color:#666;line-height:1.9;white-space:pre-wrap}.chat-box{height:560px;display:flex;flex-direction:column}.chat-head{padding:15px 18px;background:linear-gradient(135deg,#1a3a6c,#0d6efd);color:#fff}.chat-head h3{margin:0 0 3px;font-size:16px}.chat-head small{opacity:.75}.chat-messages{flex:1;overflow:auto;padding:16px;background:#f7f9fc}.chat-msg{display:flex;gap:9px;margin-bottom:14px;max-width:86%}.chat-msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#168fea;color:#fff;flex-shrink:0}.chat-msg.user .avatar{background:#31b877}.bubble{padding:9px 12px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);word-break:break-word}.chat-msg.user .bubble{background:#168fea;color:#fff}.msg-time{font-size:10px;color:#aaa;margin-top:3px}.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.chat-input textarea{flex:1;height:45px;resize:none;border:1px solid #ddd;border-radius:8px;padding:10px}.chat-input button{border:0;border-radius:8px;padding:0 16px;cursor:pointer}.send{background:#168fea;color:#fff}.empty{text-align:center;color:#aaa;padding-top:100px}@media(max-width:900px){.service-side{display:none}.service-main{padding:14px}.chat-box{height:560px}}
</style></head><body class="lottery-page">
{include file="lottery/pc_header" /}
<div class="service-layout"><aside class="service-side"><div class="service-side-title">客服咨询</div>
<a class="service-link" data-channel="wanli" href="?channel=wanli"><i class="fa-solid fa-gem"></i>万丽百家乐开户窗口</a>
<a class="service-link" data-channel="dongfang" href="?channel=dongfang"><i class="fa-solid fa-chess-queen"></i>东方汇百家乐</a>
<a class="service-link" data-channel="crown" href="?channel=crown"><i class="fa-solid fa-futbol"></i>皇冠足球开户窗口</a>
<a class="service-link" data-channel="general" href="?channel=general"><i class="fa-solid fa-headset"></i>原在线客服</a></aside>
<main class="service-main"><div class="notice"><i class="fa-solid fa-bullhorn"></i><div class="notice-track"><span class="notice-text" id="announcement">欢迎使用在线客服</span></div></div>
<div class="service-content"><section class="intro-card"><img id="introImage" class="intro-image" alt="业务介绍"><div class="intro-body"><h2 id="channelTitle">在线客服</h2><div class="intro-text" id="introText">客服正在为您服务</div></div></section>
<section class="chat-box"><div class="chat-head"><h3 id="chatTitle">在线客服</h3><small>通常5分钟内回复</small></div><div class="chat-messages" id="chatMessages"><div class="empty">发送消息开始对话</div></div>
<div class="chat-input"><button onclick="document.getElementById('chatImageFile').click()"><i class="fa-solid fa-image"></i></button><input type="file" id="chatImageFile" accept="image/*" hidden onchange="sendImage(this)"><textarea id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><button class="send" onclick="sendMessage()">发送</button></div></section></div></main></div>
<script src="/assets/lottery/js/auth.js"></script><script>
var currentChannel=new URLSearchParams(location.search).get('channel')||'general',lastMsgId=0;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function renderMessages(list){if(!list||!list.length)return;var box=document.getElementById('chatMessages'),empty=box.querySelector('.empty');if(empty)empty.remove();list.forEach(function(m){if(+m.id<=lastMsgId)return;lastMsgId=+m.id;var row=document.createElement('div');row.className='chat-msg '+(m.sender_type==='user'?'user':'admin');var content=esc(m.content);var im=m.content.match(/^\[img\](.*?)\[\/img\]$/)||m.content.match(/^(\/uploads\/kefu\/.*\.(?:jpg|jpeg|png|gif|webp))$/i);if(im)content='<img src="'+esc(im[1])+'" style="max-width:220px;border-radius:7px" onclick="window.open(this.src)">';row.innerHTML='<div class="avatar"><i class="fa-solid '+(m.sender_type==='user'?'fa-user':'fa-headset')+'"></i></div><div><div class="bubble">'+content+'</div><div class="msg-time">'+new Date(m.createtime*1000).toLocaleString()+'</div></div>';box.appendChild(row)});box.scrollTop=box.scrollHeight}
function loadHistory(){LotteryAuth.request('/index.php/api/kefu/history?channel='+encodeURIComponent(currentChannel),{method:'GET'}).then(function(r){if(r.code===1){document.getElementById('chatMessages').innerHTML='';renderMessages(r.data.list)}})}
function sendMessage(){var i=document.getElementById('chatInput'),v=i.value.trim();if(!v)return;if(!LotteryAuth.isLoggedIn()){alert('请先登录');return}var f=new FormData();f.append('content',v);f.append('channel',currentChannel);i.value='';LotteryAuth.request('/index.php/api/kefu/send',{method:'POST',body:f}).then(function(r){if(r.code===1)renderMessages([r.data]);else alert(r.msg||'发送失败')})}
function sendImage(i){if(!i.files[0])return;var f=new FormData();f.append('file',i.files[0]);fetch('/index.php/api/kefu/uploadImage',{method:'POST',headers:{token:LotteryAuth.getToken()},body:f}).then(function(r){return r.json()}).then(function(r){if(r.code!==1)return alert(r.msg||'上传失败');var m=new FormData();m.append('content','[img]'+r.data.url+'[/img]');m.append('channel',currentChannel);return LotteryAuth.request('/index.php/api/kefu/send',{method:'POST',body:m})}).then(function(r){if(r&&r.code===1)renderMessages([r.data])});i.value=''}
document.addEventListener('DOMContentLoaded',function(){if(currentChannel==='general')document.body.classList.add('general-service');document.querySelectorAll('.service-link').forEach(function(a){if(a.dataset.channel===currentChannel)a.classList.add('active')});fetch('/index.php/api/kefu/channelDetail?channel='+encodeURIComponent(currentChannel)).then(function(r){return r.json()}).then(function(r){var d=r.data||{};document.getElementById('channelTitle').textContent=d.name||'在线客服';document.getElementById('chatTitle').textContent=currentChannel==='general'?'在线客服':(d.name||'在线客服');document.getElementById('announcement').textContent=d.announcement||d.description||'欢迎使用在线客服';document.getElementById('introText').textContent=d.intro||d.description||'';if(d.image){var im=document.getElementById('introImage');im.src=d.image;im.style.display='block'}});LotteryAuth.initHeader&&LotteryAuth.initHeader();if(LotteryAuth.isLoggedIn()){loadHistory();setInterval(function(){LotteryAuth.request('/index.php/api/kefu/poll?last_id='+lastMsgId+'&channel='+encodeURIComponent(currentChannel),{method:'GET'}).then(function(r){if(r.code===1)renderMessages(r.data.list)})},5000)}});
</script></body></html>
