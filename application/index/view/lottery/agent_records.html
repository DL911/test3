<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队记录</title>
<style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f6f9;color:#222;margin:0}.wrap{max-width:1050px;margin:30px auto;padding:16px}.card{background:white;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #ddd}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:9px;border:1px solid #ddd;border-radius:7px}button{cursor:pointer;background:#1677ff;color:white;border:0}.muted{color:#777;font-size:13px}.item{border-bottom:1px solid #eee;padding:13px 0}.item:last-child{border:0}.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.tabs button{background:#e7ecf5;color:#333}.tabs button.active{background:#1677ff;color:white}pre{white-space:pre-wrap;word-break:break-all;background:#f8f8f8;padding:10px;border-radius:6px}@media(max-width:600px){.wrap{margin:0;padding:10px}.card{padding:14px}.row input,.row select{max-width:calc(50% - 16px)}}</style></head>
<body><div class="wrap"><a href="/index.php/index/lottery/agent">← 返回代理中心</a><h2>团队记录</h2>
<div class="card tabs"><button id="betTab" class="active" onclick="switchTab('bets')">团队投注</button> <button id="transferTab" onclick="switchTab('transfers')">直属划转记录</button></div>
<div id="betsPanel"><div class="card"><div class="row"><input id="start" type="date"><input id="end" type="date"><select id="direct"><option value="">全部直属分支</option></select><select id="type"><option value="">全部彩种</option><option value="1">福彩3D</option><option value="2">排列三</option></select><select id="status"><option value="">全部状态</option><option value="0">待开奖</option><option value="1">已中奖</option><option value="2">未中奖</option><option value="3">已撤单</option></select><input id="keyword" placeholder="投注账号或订单号"><button onclick="loadBets(1)">查询</button></div><p class="muted">默认最近7天；单次查询最多31天。仅查看当前代理的所有新体系下级。</p></div><div class="card" id="betSummary">加载中...</div><div class="card" id="betList"></div><div class="card row"><button onclick="loadBets(betPage-1)">上一页</button><span id="betPager"></span><button onclick="loadBets(betPage+1)">下一页</button></div></div>
<div id="transfersPanel" style="display:none"><div class="card muted">仅显示您与直属下级的余额划转。每笔均记录转出和转入余额。</div><div class="card" id="transferList"></div><div class="card row"><button onclick="loadTransfers(transferPage-1)">上一页</button><span id="transferPager"></span><button onclick="loadTransfers(transferPage+1)">下一页</button></div></div></div>
<script src="/assets/lottery/js/auth.js"></script><script>
if(!LotteryAuth.isLoggedIn())location.href='/index.php/index/lottery/login';
var betPage=1,betTotal=0,transferPage=1,transferTotal=0;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function switchTab(t){document.getElementById('betsPanel').style.display=t==='bets'?'':'none';document.getElementById('transfersPanel').style.display=t==='transfers'?'':'none';document.getElementById('betTab').classList.toggle('active',t==='bets');document.getElementById('transferTab').classList.toggle('active',t==='transfers');if(t==='transfers')loadTransfers(1)}
var now=new Date(),seven=new Date(now.getTime()-6*86400000);function day(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}document.getElementById('start').value=day(seven);document.getElementById('end').value=day(now);
LotteryAuth.request('/index.php/api/agent/subordinates',{method:'GET'}).then(function(r){if(r.code!==1)return;(r.data||[]).forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.username;document.getElementById('direct').appendChild(o)})});
function loadBets(p){if(p<1||p>1&&p>Math.ceil(betTotal/20))return;var q=new URLSearchParams({page:p,date_start:document.getElementById('start').value,date_end:document.getElementById('end').value,direct_id:document.getElementById('direct').value,lottery_type:document.getElementById('type').value,status:document.getElementById('status').value,keyword:document.getElementById('keyword').value});LotteryAuth.request('/index.php/api/agent/teamBets?'+q,{method:'GET'}).then(function(r){if(r.code!==1)return alert(r.msg||'查询失败');betPage=p;betTotal=r.data.total;document.getElementById('betSummary').textContent='订单 '+betTotal+' 笔 · 有效投注 ¥'+Number(r.data.bet_amount).toFixed(2)+' · 中奖 ¥'+Number(r.data.win_amount).toFixed(2);document.getElementById('betPager').textContent='第 '+p+' / '+Math.max(1,Math.ceil(betTotal/20))+' 页';var names=['待开奖','已中奖','未中奖','已撤单'];document.getElementById('betList').innerHTML=(r.data.list||[]).map(function(x){return '<div class="item"><div class="head"><b>'+esc(x.username)+' · '+(x.lottery_type==1?'福彩3D':'排列三')+' · '+esc(x.period)+'</b><span>'+esc(names[x.status]||x.status)+'</span></div><div class="muted">'+esc(x.date)+' · '+esc(x.order_no)+' · 层级距离 '+esc(x.distance)+' · 直属分支 ID '+esc(x.direct_id)+'</div><div>投注 ¥'+esc(x.total_amount)+' · 中奖 ¥'+esc(x.win_amount||0)+' · '+esc(x.play_type)+'</div><details><summary>投注内容</summary><pre>'+esc(x.bet_content)+'</pre></details></div>'}).join('')||'暂无投注记录'}).catch(function(){alert('查询失败，请稍后重试')})}
function loadTransfers(p){if(p<1||p>1&&p>Math.ceil(transferTotal/20))return;LotteryAuth.request('/index.php/api/agent/transferHistory?page='+p,{method:'GET'}).then(function(r){if(r.code!==1)return alert(r.msg||'查询失败');transferPage=p;transferTotal=r.data.total;document.getElementById('transferPager').textContent='第 '+p+' / '+Math.max(1,Math.ceil(transferTotal/20))+' 页';document.getElementById('transferList').innerHTML=(r.data.list||[]).map(function(x){return '<div class="item"><div class="head"><b>'+esc(x.sub_name)+' · '+(x.direction==='give'?'加款':'扣款')+' ¥'+esc(x.amount)+'</b><span>'+esc(x.date)+'</span></div><div class="muted">单号 '+esc(x.order_no)+' · 原因：'+esc(x.remark||'无')+'</div><div class="muted">转出余额 '+esc(x.from_before)+' → '+esc(x.from_after)+'；转入余额 '+esc(x.to_before)+' → '+esc(x.to_after)+'</div></div>'}).join('')||'暂无划转记录'})}loadBets(1);
</script></body></html>
