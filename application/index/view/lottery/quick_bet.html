<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快译模式</title>
<style>body{margin:0;background:#f3f7fa;color:#18342f;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:20px auto;padding:16px}.head,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.card{background:#fff;border:1px solid #d8e5df;border-radius:14px;padding:20px;margin:12px 0}textarea{width:100%;box-sizing:border-box;min-height:160px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #c6d8d0;border-radius:8px}button{cursor:pointer;background:#1677ff;color:white;border:0}.secondary{background:#edf4f0;color:#224c43}.danger{color:#b63e35}.muted{color:#71847f;font-size:13px}.line{padding:12px 0;border-bottom:1px solid #edf0ee}.line:last-child{border:0}#submit{width:100%;font-size:17px;padding:15px}#submit:disabled{background:#9cb2bd}.row input,.row select{max-width:170px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{margin:0;padding:10px}.card{padding:15px}.row input,.row select{max-width:42%}}</style></head><body>
<div class="wrap"><div class="head"><div><a href="/index.php/index/lottery/bet?type={$lottery_type}">← 返回投注页</a><h1>快译模式 <small id="gameName"></small></h1></div><button class="secondary" id="showOdds">查看玩法赔率</button></div><div class="grid"><section class="card"><h2>输入投注内容</h2><p class="muted">支持“直选 123 10元”“百位 5 10元”“和值单 10元”等单行写法，也支持“直选／两码定位”标题、多行号码和末尾“各打20元”。不同段落可用空行分隔。</p><textarea id="raw" maxlength="10000" placeholder="输入或粘贴本次投注内容"></textarea><p><button id="recognize" disabled>快译并核对</button> <button class="secondary" id="manual" disabled>手动添加</button></p><p id="message" class="danger"></p></section><aside class="card"><h2>本次投注</h2><p>彩种：<b id="gameLabel"></b></p><p>当前期号：<b id="period">读取中</b></p><p>余额：¥<b id="balance">--</b></p><p>候选：<b id="count">0</b> 笔　合计：<b id="total">¥0.00</b></p><p class="muted">识别结果仅作候选；核对后点击下方按钮才会真实扣款。</p></aside></div>
<section class="card"><h2>核对候选注单</h2><div id="pending" class="danger"></div><div id="entries" class="muted">尚无候选注单。</div></section><section class="card"><button id="submit" disabled>确认投注</button><p class="muted">提交时服务端会重新核对期号、赔率和余额。任一项无效，整批不扣款。</p><p id="result"></p></section></div>
<dialog id="manualDialog"><h2>手动补充一笔</h2><div class="row"><select id="manualPlay"></select><input id="manualNumber" placeholder="号码；条件玩法留空"><select id="manualPos"><option value="">不指定位置</option><option value="0">百位</option><option value="1">十位</option><option value="2">个位</option><option value="01">百十</option><option value="02">百个</option><option value="12">十个</option></select><input id="manualAmount" type="number" min="0.01" step="0.01" placeholder="每笔金额"></div><p><button id="manualAdd">加入核对</button> <button class="secondary" id="manualClose">关闭</button></p></dialog><dialog id="oddsDialog"><h2>玩法赔率</h2><div id="oddsList"></div><p><button id="oddsClose">关闭</button></p></dialog>
<script src="/assets/lottery/js/auth.js"></script><script>
(function(){'use strict';var game='{$lottery_type}',name=game==='fc3d'?'福彩3D':'排列三',settings=null,items=[],pending=[],period='',batchId='';if(!LotteryAuth.isLoggedIn()){location.href='/index.php/index/lottery/login';return}document.getElementById('gameName').textContent=name;document.getElementById('gameLabel').textContent=name;
function el(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function msg(s){el('message').textContent=s}function loadSettings(){return LotteryAuth.request('/index.php/api/quickbet/settings?type='+game,{method:'GET'}).then(function(r){if(r.code!==1)throw Error(r.msg||'赔率读取失败');settings=r.data;var list=r.data.rows||[],catalog=r.data.catalog||{};el('oddsList').innerHTML=list.map(function(x){return '<div class="line">'+esc(catalog[x.play_code]||x.play_code)+'　'+(x.status==1?'赔率 '+esc(x.odds):'暂未开放')+'<br><span class="muted">'+esc(x.description)+'</span></div>'}).join('');el('manualPlay').innerHTML='<option value="">选择玩法</option>'+list.filter(function(x){return x.status==1}).map(function(x){return '<option value="'+esc(x.play_code)+'">'+esc(catalog[x.play_code])+'</option>'}).join('');return r.data})}
function getRate(play){var x=(settings.rows||[]).find(function(r){return r.play_code===play&&r.status==1});return x?Number(x.odds):0}function normalized(play,number,pos,amount){number=String(number||'');pos=String(pos||'');amount=String(amount||'');if(!getRate(play))throw Error('玩法尚未启用：'+play);if(!/^\d{1,8}(\.\d{1,2})?$/.test(amount)||Number(amount)<=0)throw Error('金额必须为正数，最多两位小数');if(play==='direct'&&!/^\d{3}$/.test(number))throw Error('直选须为三位数字');if(play==='onepos'&&(!/^\d$/.test(number)||! /^[012]$/.test(pos)))throw Error('一码定位号码或位置无效');if(play==='twopos'&&(!/^\d{2}$/.test(number)||! /^(01|02|12)$/.test(pos)))throw Error('两码定位号码或位置无效');if(play.indexOf('pos')===0&&! /^[012]$/.test(pos))throw Error('位置玩法只支持单个位置');return {play:play,number:number,pos:pos,amount:Number(amount).toFixed(2),odds:getRate(play)}}
function parseLine(line){var s=line.replace(/[，,：:]/g,' ').replace(/\s+/g,' ').trim(),m,p='',n='',pos='',amount='';m=s.match(/^(?:直选|直)\s*(\d{3})\s*(?:各|打)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?$/);if(m){p='direct';n=m[1];amount=m[2]}else{m=s.match(/^(百十|百个|十个|百位|十位|个位)\s*(\d{1,2})\s*(?:各|打)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?$/);if(m){pos={'百位':'0','十位':'1','个位':'2','百十':'01','百个':'02','十个':'12'}[m[1]];p=pos.length===1?'onepos':'twopos';n=m[2];amount=m[3]}else{m=s.match(/^(和值)?(单|双|大|小)\s*(?:打)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?$/);if(m){p=(m[1]?'sum':'pos')+{'单':'odd','双':'even','大':'big','小':'small'}[m[2]];amount=m[3];if(!m[1])throw Error('位置玩法缺少百位、十位或个位');}else{m=s.match(/^(百位|十位|个位)(单|双|大|小)\s*(?:打)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?$/);if(m){p='pos'+{'单':'odd','双':'even','大':'big','小':'small'}[m[2]];pos={'百位':'0','十位':'1','个位':'2'}[m[1]];amount=m[3]}}}}if(!p)throw Error('写法尚未支持，请手动补充');return normalized(p,n,pos,amount)}
function parseBlock(block){var lines=block.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean);if(lines.length===1){var single=lines[0].match(/^(?:福|排|体)?\s*(?:三码)?直选\s+([\d\s,，、]+)\s+各(?:打)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?$/);if(single){var nums=single[1].split(/[\s,，、]+/).filter(Boolean);if(!nums.length||nums.some(function(n){return !/^\d{3}$/.test(n)}))throw Error('直选号码格式无效');return nums.map(function(n){return normalized('direct',n,'',single[2])})}return [parseLine(lines[0])]}
var title=lines[0].replace(/^(?:福彩3D|福彩|排列三|排三|福|排|体)\s*/,'').trim(),tail=lines[lines.length-1].match(/^各(?:打)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块)?$/);if(!tail||lines.length<3)throw Error('多行号码缺少明确的统一金额');var tokens=lines.slice(1,-1).join(' ').split(/[\s,，、]+/).filter(Boolean);if(!tokens.length||tokens.length>100)throw Error('号码数量不正确');if(/^(?:三码)?直选$/.test(title)){if(tokens.some(function(n){return !/^\d{3}$/.test(n)}))throw Error('直选号码必须是三位数字');return tokens.map(function(n){return normalized('direct',n,'',tail[1])})}if(/^两码定位$/.test(title)){return tokens.map(function(mask){if(!/^(?:\d\d\*|\d\*\d|\*\d\d)$/.test(mask))throw Error('两码定位应使用如56*的星号格式');var positions='',digits='';for(var i=0;i<3;i++)if(mask[i]!=='*'){positions+=i;digits+=mask[i]}return normalized('twopos',digits,positions,tail[1])})}throw Error('多行标题尚未支持')}
function render(){var catalog=settings?settings.catalog:{},sum=items.reduce(function(t,x){return t+Number(x.amount)},0);el('count').textContent=items.length;el('total').textContent='¥'+sum.toFixed(2);el('pending').innerHTML=pending.map(function(x,i){return '<div class="line">待补充：'+esc(x)+' <button class="secondary" data-resolve="'+i+'">已手动补充／放弃该段</button></div>'}).join('');el('pending').querySelectorAll('[data-resolve]').forEach(function(b){b.onclick=function(){if(confirm('确认已手动添加正确投注，或明确放弃这一段？')){pending.splice(Number(b.dataset.resolve),1);render()}}});el('entries').innerHTML=items.length?items.map(function(x,i){return '<div class="line"><b>'+esc(catalog[x.play]||x.play)+'</b>　'+esc(x.number||'条件投注')+'　位置 '+esc(x.pos||'—')+'　¥'+esc(x.amount)+' × '+esc(x.odds)+' <button class="secondary" data-remove="'+i+'">移除</button></div>'}).join(''):'暂无候选注单。';el('submit').disabled=!items.length||!!pending.length||!period;el('entries').querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){items.splice(Number(b.dataset.remove),1);render()}})}
el('recognize').onclick=function(){items=[];pending=[];batchId='';var blocks=String(el('raw').value||'').trim().split(/\r?\n\s*\r?\n/).filter(Boolean);blocks.forEach(function(block){try{Array.prototype.push.apply(items,parseBlock(block))}catch(e){var first=block.split(/\r?\n/)[0].replace(/^(?:福彩3D|福彩|排列三|排三|福|排|体)\s*/,'').trim();if(!/^(?:三码)?直选$|^两码定位$/.test(first)){block.split(/\r?\n/).forEach(function(line){try{items.push(parseLine(line))}catch(inner){pending.push(line+'：'+inner.message)}})}else pending.push(block+'：'+e.message)}});msg(pending.length?'存在未明确内容，请补充或删除对应原文后重新快译。':'请逐笔核对号码、金额与赔率。');render()};el('manual').onclick=function(){el('manualDialog').showModal()};el('manualClose').onclick=function(){el('manualDialog').close()};el('manualAdd').onclick=function(){try{items.push(normalized(el('manualPlay').value,el('manualNumber').value,el('manualPos').value,el('manualAmount').value));batchId='';el('manualDialog').close();render()}catch(e){alert(e.message)}};el('showOdds').onclick=function(){el('oddsDialog').showModal()};el('oddsClose').onclick=function(){el('oddsDialog').close()};
function loadDraw(){LotteryAuth.request('/index.php/api/lottery/getLatestDraw?type='+game,{method:'GET'}).then(function(r){var d=r.data||{};period=d.next&&d.next.period||'';el('period').textContent=period||'暂无可投注期号';render()})}function loadBalance(){LotteryAuth.request('/index.php/api/user/index',{method:'GET'}).then(function(r){if(r.code===1)el('balance').textContent=Number(r.data.money||0).toFixed(2)})}
el('submit').onclick=function(){if(pending.length||!items.length)return;el('submit').disabled=true;loadSettings().then(function(){items.forEach(function(x){if(!getRate(x.play)||getRate(x.play)!==x.odds)throw Error('赔率已变化，请重新快译核对')});var total=items.reduce(function(t,x){return t+Number(x.amount)},0);if(!confirm('确认投注 '+items.length+' 笔，合计 ¥'+total.toFixed(2)+'，期号 '+period+'？')){render();return}if(!batchId)batchId='Q'+Date.now()+'-'+Math.random().toString(36).slice(2,14);var f=new FormData();f.append('type',game);f.append('period',period);f.append('version',settings.version);f.append('request_id',batchId);f.append('raw',el('raw').value);f.append('items',JSON.stringify(items));return LotteryAuth.request('/index.php/api/quickbet/place',{method:'POST',body:f}).then(function(r){if(r.code!==1)throw Error(r.msg||'投注失败');el('result').textContent='投注成功，订单号 '+r.data.order_no+(r.data.total_amount?'，金额 ¥'+r.data.total_amount:'');items=[];pending=[];batchId='';render();loadBalance()})}).catch(function(e){msg(e.message);render()})};loadSettings().then(function(){el('recognize').disabled=false;el('manual').disabled=false;render()}).catch(function(e){msg('暂时无法读取后台赔率，输入内容已保留：'+e.message)});loadDraw();loadBalance();})();
</script></body></html>
