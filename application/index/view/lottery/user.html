    <script>
    // ===== 退出登录 =====
    function doLogout() {
        if (confirm('确认退出登录？')) {
            localStorage.removeItem('lottery_token');
            localStorage.removeItem('lottery_user');
            window.location.href = '/index.php/index/lottery/login';
        }
    }

    // ===== 头像上传 =====
    function triggerAvatarUpload() {
        if (!LotteryAuth.isLoggedIn()) return;
        document.getElementById('avatarInput').click();
    }

    function handleAvatarUpload(input) {
        var file = input.files && input.files[0];
        if (!file) return;
        // 限制大小 2MB
        if (file.size > 2 * 1024 * 1024) {
            alert('图片不能超过2MB'); return;
        }

        var formData = new FormData();
        formData.append('file', file);

        var token = LotteryAuth.getToken();

        // 第1步: 上传文件
        fetch('/index.php/api/common/upload', {
            method: 'POST',
            headers: { 'token': token },
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code === 1 && res.data && res.data.url) {
                // 第2步: 更新用户头像
                return saveAvatar(res.data.fullurl || res.data.url, res.data.url);
            } else {
                alert(res.msg || '上传失败');
            }
        })
        .catch(function(e) {
            alert('上传出错: ' + e.message);
        });

        // 清空 input，允许重复选同一文件
        input.value = '';
    }

    function saveAvatar(displayUrl, saveUrl) {
        var token = LotteryAuth.getToken();
        var formData = new FormData();
        formData.append('avatar', saveUrl);

        return fetch('/index.php/api/user/profile', {
            method: 'POST',
            headers: { 'token': token },
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code === 1) {
                // 更新页面显示
                setAvatarDisplay(displayUrl);
                // 更新缓存
                var u = LotteryAuth.getCachedUser();
                if (u) {
                    u.avatar = displayUrl;
                    localStorage.setItem('lottery_user', JSON.stringify(u));
                }
            } else {
                alert(res.msg || '保存头像失败');
            }
        });
    }

    function setAvatarDisplay(url) {
        var el = document.getElementById('userAvatar');
        var icon = document.getElementById('avatarIcon');
        if (el && url) {
            el.style.backgroundImage = 'url(' + url + ')';
            el.style.backgroundColor = 'transparent';
            if (icon) icon.style.display = 'none';
        }
    }

    // ===== 页面初始化 =====
    document.addEventListener('DOMContentLoaded', function() {
        if (LotteryAuth.isLoggedIn()) {
            // 先用缓存快速显示
            var u = LotteryAuth.getCachedUser();
            if (u) showUserUI(u);

            // 再从服务器获取最新数据（刷新余额等）
            LotteryAuth.fetchUserInfo(function(freshUser) {
                if (freshUser) showUserUI(freshUser);
            });
        }

        function showUserUI(u) {
            document.getElementById('loggedOutView').style.display = 'none';
            document.getElementById('loggedInView').style.display = 'block';
            document.getElementById('balanceCard').style.display = 'block';
            document.getElementById('logoutBtn').style.display = '';

            document.getElementById('userName').textContent = u.nickname || u.username || '--';
            document.getElementById('userId').textContent = 'ID: ' + (u.id || u.user_id || '--');

            var uw = document.getElementById('userBalanceWrapper');
            if (uw) uw.innerHTML = LotteryAuth.formatMoney(u.money);

            // 显示头像
            if (u.avatar) setAvatarDisplay(u.avatar);

            // 显示相机小图标
            var badge = document.getElementById('avatarBadge');
            if (badge) badge.style.display = 'flex';

            // 显示流水返利入口
            var rg = document.getElementById('rebateGroup');
            if (rg) rg.style.display = '';

            // 显示实名认证状态
            var vs = (u.verify_status !== undefined) ? u.verify_status : -1;
            var badge = document.getElementById('verifyBadge');
            var vText = document.getElementById('verifyStatusText');
            if (vs === 1) {
                if (badge) { badge.textContent = '已认证'; badge.style.display = 'inline'; badge.style.background = '#e8f5e9'; badge.style.color = '#2e7d32'; }
                if (vText) vText.textContent = '已通过实名认证';
            } else {
                if (badge) { badge.textContent = '未认证'; badge.style.display = 'inline'; badge.style.background = '#f5f5f5'; badge.style.color = '#888'; }
                if (vText) vText.textContent = '请完成实名认证';
            }
            window._verifyStatus = vs;
        }

        // 实名认证拦截：充值/提现需已认证
        window.goIfVerified = function(url) {
            var vs = window._verifyStatus;
            if (vs === 1) {
                location.href = url;
            } else {
                alert('请先完成实名认证，微信/支付宝充提需使用认证姓名的账号');
                location.href = '/index.php/index/lottery/verify';
            }
        };

        // logout handled by doLogout() onclick

        // 检查客服未读
        if (LotteryAuth.isLoggedIn()) {
            LotteryAuth.request('/index.php/api/kefu/unreadCount', {method: 'GET'})
                .then(function(res) {
                    if (res.code === 1 && res.data && res.data.count > 0) {
                        var textEl = document.getElementById('kefuUnreadText');
                        if (textEl) {
                            textEl.innerHTML = '<span style="color:var(--m-accent);font-weight:bold;">您有 ' + res.data.count + ' 条未读消息</span>';
                        }
                    }
                });
        }
    });
